<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#f7f3e9">
<title>Re:Step</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  color-scheme: light;
  --bg:#f5f1e7; --paper:#fffdf8; --paper2:#fbf9f3; --ink:#263128; --muted:#7c827a;
  --line:#e5dfd3; --green:#63a96d; --green-d:#397a48; --green-bg:#edf7e9;
  --lav:#8270bd; --lav-bg:#f1edfb; --rose:#dc7283; --rose-bg:#fff0f3;
  --amber:#b7781d; --amber-bg:#fff3dd; --blue:#4d86b8; --blue-bg:#edf6ff;
  --danger:#c85757; --danger-bg:#fff0ee; --shadow:0 12px 34px rgba(61,73,57,.08);
  --radius:22px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
font-family:Inter,Pretendard,"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
body{min-height:100vh}
.app{width:min(430px,100%);margin:0 auto;min-height:100vh;background:var(--paper);position:relative;box-shadow:0 0 0 1px rgba(0,0,0,.02)}
.screen{display:none;min-height:100vh;padding:20px 18px 28px}
.screen.active{display:block}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.hdr{position:relative;height:44px;display:flex;align-items:center;justify-content:flex-end;margin-bottom:14px}
#homeScreen .hdr{margin-bottom:28px} /* 메인 화면만: 로고와 역할 전환 탭 사이 여유(+14). 목차 화면 header는 기존 간격 유지 */
.hdr-logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;pointer-events:none}
.hdr-logo img{height:32px;width:auto;display:block;object-fit:contain}
.hdr-right{display:flex;gap:0;position:relative;z-index:1;margin-right:-6px}
/* 헤더 아이콘: 기본은 배경·테두리·그림자 없이 아이콘만(보이는 크기 약 22px), 클릭 영역은 36px. 누를 때만 아주 옅은 lavender */
.hdr-btn{width:36px;height:36px;border:0;background:transparent;padding:0;border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;transition:background .12s ease,opacity .12s ease}
.hdr-btn + .hdr-btn{margin-left:-2px}
.hdr-btn img{width:24px;height:24px;display:block}
.hdr-btn:hover{background:rgba(130,112,189,.08)}
.hdr-btn:active{background:var(--lav-bg);opacity:.85}
.hdr-btn .badge{top:1px;right:1px}
.brand{font-size:28px;font-weight:950;letter-spacing:-.045em;color:#347a45}
.brand.cheer{color:#6d58aa}
.subtle{font-size:12px;color:var(--muted);line-height:1.55}
.home-sub{font-size:13px;color:#5f6b5c;line-height:1.5}
h1,h2,h3,h4,p{margin-top:0}
h1{font-size:38px;letter-spacing:-.05em}
h2{font-size:22px;letter-spacing:-.035em}
h3{font-size:17px;letter-spacing:-.025em}
.iconbtn{width:40px;height:40px;border:0;border-radius:13px;background:#f1eee7;color:var(--ink);font-weight:900;position:relative}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.card.compact{padding:11px 13px;border-radius:17px;box-shadow:0 4px 14px rgba(61,73,57,.05)}
.card.record{padding:10px 12px;border-radius:16px;margin-bottom:8px}
.card.record b{font-size:13.5px}
.card.record p{font-size:12.5px;margin:5px 0 0}
.card.record .subtle{font-size:10.5px;margin-top:4px;line-height:1.4}
.stat-split{display:flex;gap:8px;margin-bottom:14px}
.stat-chip{flex:1;border-radius:16px;padding:11px 13px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.stat-chip.green{background:var(--green-bg);color:var(--green-d)}
.stat-chip.lav{background:var(--lav-bg);color:#6d58a8}
.stat-chip .stat-num{font-size:20px;font-weight:900;line-height:1.15}
.stat-chip .stat-label{font-size:10.5px;font-weight:800;opacity:.8}
.recap-link{display:block;width:100%;background:transparent;border:0;padding:6px 4px 0;font-size:12px;font-weight:800;text-align:center;cursor:pointer}
.recap-link.green{color:var(--green-d)}
.recap-link.lav{color:#6d58a8}
.card.green{background:linear-gradient(145deg,#f8fcf5,#eef7e8)}
.card.lav{background:linear-gradient(145deg,#fcfbff,#f1edfb)}
.card.rose{background:linear-gradient(145deg,#fffafd,#fff1f4)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:grid;gap:10px}
.btn{border:0;border-radius:15px;padding:13px 15px;font-weight:850}
.btn.primary{background:var(--green);color:#fff}
.btn.purple{background:var(--lav);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.secondary{background:#f2efe8;color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:transparent;border:1px dashed #b7d6bd;color:#477853}
.btn.save{background:var(--green-bg);color:var(--green-d);border:1px solid var(--green);font-weight:900}
.btn.danger{background:var(--danger-bg);color:var(--danger)}
.btn.full{width:100%}
.btn:disabled{opacity:.42;cursor:not-allowed}
input:disabled,textarea:disabled{background:#f1efe9;color:var(--muted);cursor:not-allowed;border-color:var(--line)}
.smallbtn{border:0;border-radius:10px;padding:9px 13px;background:#f0eee8;font-size:11.5px;font-weight:850;color:var(--ink)}
.smallbtn:disabled{opacity:.35;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:4px;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:850;background:var(--green-bg);color:var(--green-d)}
.pill.lav{background:var(--lav-bg);color:#6b58a3}
.pill.rose{background:var(--rose-bg);color:#b95065}
.pill.amber{background:var(--amber-bg);color:#98631b}
.pill.gray{background:#f0eee9;color:#777}
.mini-status{font-size:11px;font-weight:850;padding:7px 11px;border-radius:999px;display:inline-block}
.mini-status.ok{background:var(--green-bg);color:var(--green-d)}
.mini-status.warn{background:var(--amber-bg);color:#98631b}
.login{padding-top:62px;text-align:center}
.login .brand{font-size:44px}
.login .sprout{font-size:62px;margin:26px 0}
.mode{display:flex;gap:4px;padding:4px;border-radius:999px;background:#f1eee8}
.mode button{border:0;background:transparent;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:850;color:var(--muted);flex:1;text-align:center}
.mode button.active{background:#fff;color:var(--green-d);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:22px 0 10px}
.section-head h3{margin:0}
.empty{text-align:center;padding:25px 16px}
.empty .emoji{font-size:42px;margin-bottom:12px}
.input-group{margin-bottom:11px}
label{display:block;font-size:12px;font-weight:850;margin-bottom:6px}
input,textarea{width:100%;border:1px solid var(--line);border-radius:13px;background:#fbfaf6;color:var(--ink);padding:12px 13px;outline:none}
textarea{resize:vertical}
input:focus,textarea:focus{border-color:#89b391;box-shadow:0 0 0 3px rgba(99,169,109,.12)}
.page-card{cursor:pointer}
.page-card h3{margin-bottom:4px}
.daytext{font-size:12px;font-weight:900;color:#516154}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:#f1eee8;border-radius:999px;padding:4px;margin-bottom:18px}
.tabs button{border:0;background:transparent;border-radius:999px;padding:8px;font-weight:850;color:#6d706b}
.tabs button.active{background:#79ad7c;color:#fff}
.review{border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;background:#fff;cursor:pointer}
.review.done{background:#f4faf2;border-color:#b6d4ba}
.locked-dim{filter:grayscale(.6);opacity:.55;pointer-events:none;transition:opacity .3s ease}
.review-title{font-weight:950;font-size:16px}
.review-items{font-size:12px;color:#626861;line-height:1.65;margin-top:7px}
.review-items .memo{color:#92968f}
.check{font-size:22px}
.session-panel{background:#f8f6f0;border:1px solid var(--line);border-radius:18px;padding:14px}
.draft{padding:12px 0;border-top:1px solid var(--line)}
.draft:first-child{border-top:0}
.notice{border-radius:17px;padding:13px;font-size:12px;line-height:1.55;margin-bottom:13px}
.notice.lock{background:var(--lav-bg);border:1px solid #d8cfee;color:#5e4c90}
.notice.danger{background:var(--danger-bg);border:1px solid #f0c9c5;color:#a34848}
.notice.offline{background:var(--amber-bg);border:1px solid #ebd1a6;color:#7d5925}
.notice.readonly{background:var(--blue-bg);border:1px solid #c9def0;color:#37688e}
.record{background:#fff;border:1px solid var(--line);border-radius:17px;padding:12px 14px;margin-bottom:10px;cursor:pointer;transition:background .12s ease}
.record:active{background:#faf8f3}
.status-card{cursor:pointer;transition:background .12s ease}
.status-card:active{background:#faf8f3}
/* 파트너 Re:Step 상세 — 수첩 인덱스형 가로 스와이프 */
.rs-tabs{display:flex;gap:3px;align-items:flex-end;margin-top:16px;position:relative;z-index:1;margin-bottom:-1px}
.rs-tabs button{flex:1;border:1px solid var(--line);border-bottom:0;border-radius:13px 13px 0 0;background:#faf8f3;color:var(--muted);font-size:13px;font-weight:600;padding:9px 0;transition:background .2s ease,color .2s ease,padding .2s ease}
.rs-tabs button.active{background:var(--lav-bg);color:#4b3b86;font-weight:700;padding-top:12px}
.rs-card{background:#fff;border:1px solid var(--line);border-radius:0 0 18px 18px;overflow:hidden}
.rs-viewport{display:flex;align-items:flex-start;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;transition:height .2s ease;cursor:grab}
.rs-viewport::-webkit-scrollbar{display:none}
.rs-viewport.dragging{cursor:grabbing;user-select:none}
.rs-page{flex:0 0 100%;min-width:0;box-sizing:border-box;scroll-snap-align:start;padding:14px 16px 12px}
.rs-h{font-size:15px;font-weight:800;margin-bottom:4px}
.rs-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.rs-n{flex:0 0 32px;width:32px;height:32px;border-radius:50%;background:#efeaf9;color:#4b3b86;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.rs-b{min-width:0;flex:1}
.rs-list>.rs-row:first-child{border-top:0}
.rs-t{font-size:14px;font-weight:700;color:var(--ink);overflow-wrap:anywhere}
.rs-s{font-size:12px;color:var(--muted);margin-top:3px}
.rs-fold{display:inline-block;margin-top:4px;padding:6px 0 2px;font-size:12px;font-weight:600;color:#6d58a8;cursor:pointer}
.rs-dots{display:flex;justify-content:center;gap:6px;margin:10px 0 18px}
.rs-dots span{width:6px;height:6px;border-radius:50%;background:#dcd6ea;transition:background .2s ease}
.rs-dots span.on{background:var(--lav)}
/* 월간 "보낸 Re:Cheer" 기록 카드 — 색면 없는 white paper 행, 작은 chevron으로만 클릭 가능함을 암시 */
.cl-card{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e8e3f0;border-radius:14px;padding:10px 14px;margin-bottom:8px;cursor:pointer;transition:background .12s ease}
.cl-card:active{background:#faf8fd}
.cl-b{min-width:0;flex:1}
.cl-t{font-size:13.5px;font-weight:700;color:var(--ink)}
.cl-m{font-size:13px;font-weight:500;color:#3f4a42;margin-top:3px;overflow-wrap:anywhere}
.cl-d{font-size:11px;color:#8a8498;margin-top:4px}
.cl-c{flex-shrink:0;font-size:18px;line-height:1;color:#b4aecb}
/* 월간 기록 인덱스(받은 Re:Step / 보낸 Re:Cheer) — 목록과 이어진 파일철 탭. green/lavender는 활성 때 아주 옅게만. */
.mi-tabs{display:flex;gap:3px;align-items:flex-end;position:relative;z-index:1;margin-bottom:-1px}
.mi-tab{flex:1;border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;background:#faf8f3;color:var(--muted);padding:7px 0 8px;display:flex;flex-direction:column;align-items:center;gap:1px;transition:background .2s ease,color .2s ease,padding .2s ease}
.mi-tab .l{font-size:10.5px;font-weight:600}
.mi-tab .n{font-size:17px;font-weight:800;line-height:1.2}
.mi-tab.active{padding-top:10px}
.mi-tab.green.active{background:#f0f7ec;color:#2f6b3d}
.mi-tab.lav.active{background:var(--lav-bg);color:#4b3b86}
.mi-body{background:#fcfbf7;border:1px solid var(--line);border-radius:0 0 16px 16px;padding:10px 10px 2px}
@keyframes miFade{from{opacity:0}to{opacity:1}}
.mi-fade{animation:miFade .18s ease}
/* 학습 탭: 복습 | 새 학습 서브탭, 저장된 새 학습 행, 상단 학습취소/마감하기 */
/* 복습 | 새 학습: 탭(index)과 콘텐츠를 하나의 패널로. 선택된 탭이 패널 윗선을 덮어 끊김 없이 이어짐 */
.sa-tabs{display:flex;gap:4px;align-items:flex-end;margin:16px 0 0;position:relative;z-index:1}
.sa-tabs button{flex:1;border:1px solid #dfe8d8;border-bottom:0;border-radius:13px 13px 0 0;background:#faf8f3;color:var(--muted);font-size:13px;font-weight:600;padding:9px 0;transition:background .2s ease,color .2s ease}
.sa-tabs button.active{background:#e6f1de;color:#2f6a3d;font-weight:800;padding-top:11px;padding-bottom:10px;margin-bottom:-1px;border-color:#cfe3c3}
.sa-panel{background:#fcfbf6;border:1px solid #dfe8d8;border-radius:0 0 16px 16px;overflow:hidden}
.sa-panel .rs-page{padding:16px 14px 18px}
.rs-viewport.noswipe{overflow-x:hidden;cursor:auto} /* 학습자 화면의 복습|새 학습은 스와이프 없이 탭 누름으로만 이동(입력 중 손가락이 흔들려 넘어가는 일 방지) */
.sa-dots span.on{background:#7fb487}
.sa-panel .review:last-child{margin-bottom:0}
.sa-panel .dr-row:first-child{margin-top:0}
.sa-btn{min-width:66px;font-size:12px;font-weight:700;padding:7px 10px;border-radius:10px;border:1px solid transparent;background:transparent;color:#5f665d}
.sa-btn.close{color:var(--green-d);border-color:#c9e3cb}
.sa-btn:disabled{background:#f4f1ea;border-color:transparent;color:#b3ae9f;cursor:not-allowed}
.dr-row{display:flex;align-items:center;gap:10px;background:#fffefb;border:1px solid #e9e2d3;border-radius:14px;padding:10px 12px;margin-top:8px}
.dr-row.editing{border-color:#bfe0c4;background:#fafdf9}
.dr-n{flex:0 0 22px;width:22px;height:22px;border-radius:50%;background:var(--green-bg);color:var(--green-d);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.dr-b{min-width:0;flex:1}
.dr-t{font-size:14px;font-weight:700;color:var(--ink);overflow-wrap:anywhere}
.dr-s{font-size:12px;color:var(--muted);margin-top:2px}
.dr-a{display:flex;gap:12px;flex-shrink:0}
.dr-edit{font-size:12px;font-weight:800;color:var(--green-d);cursor:pointer}
.dr-del{font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
.dr-edit.off,.dr-del.off{opacity:.4;cursor:default}
.dr-form{background:#fffefb;border:1px solid #e9e2d3;border-radius:14px;padding:14px;margin-top:12px}
/* 학습자 홈: 두 개의 독립 section surface */
.home-sec{border-radius:22px;padding:16px}
.home-sec.learn{background:#e8f3e0;border:1px solid #d3e6c9}
.home-sec.restep{background:#f3f0f9;border:1px solid #e3ddf0;padding:14px;margin-top:22px}
.pg-card{display:flex;align-items:center;gap:12px;background:#fffefb;border:1px solid #e6e1ef;border-radius:18px;padding:13px 14px;margin-bottom:10px;cursor:pointer}
.pg-card:active{background:#faf8fd}
.pg-ico{width:44px;height:44px;flex-shrink:0;object-fit:contain}
.pg-b{flex:1;min-width:0}
.pg-card h3{margin:0 0 3px;font-size:16px;color:#2d2640;overflow-wrap:anywhere}
.pg-sub{font-size:12.5px;color:#8b84a3}
.pg-chev{flex-shrink:0;width:18px;height:18px}
/* 목차(영역) 화면: 소개 영역 + 조용한 관리 + 하단 생성 버튼 */
.hdr-back{position:absolute;left:-6px;top:4px;z-index:1}
.ar-intro{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:6px 0 20px}
.ar-title{margin:0;padding-left:12px;font-size:22px;font-weight:800;color:#2d2640;min-width:0} /* 카드 안쪽 시작선(아이콘)에 가깝게: 화면 가장자리에서 30px */
.ar-deco-box{width:88px;height:76px;flex-shrink:0;margin-right:12px;transform:translateY(-4px);display:flex;align-items:center;justify-content:center} /* 제목 중앙보다 살짝 위. 좌(제목)·우(장식) 모두 카드 가장자리에서 12px 안쪽 */
.ar-deco{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}
.ar-actions{display:flex;gap:10px;margin-top:22px}
.ar-btn{height:48px;border-radius:16px;font-size:14px;font-weight:800;cursor:pointer;border:1px solid transparent;font-family:inherit}
.ar-btn.sec{flex:35 1 0;background:#fffefb;border-color:#dcdfd6;color:#556057} /* 보조 버튼은 중립(크림·회색 테두리) — 보라/초록 어느 쪽도 주색이 되지 않게 */
.ar-btn.pri{flex:65 1 0;background:#e3f0da;border-color:#cfe3c3;color:#2f6a3d} /* 색 역할: 초록=학습자가 직접 하는 행동, 보라=구조/브랜드 */
.ar-btn.sec:active{background:#f4f6f0}
.ar-btn.pri:active{background:#d3e6c8}
.ar-btn:disabled{opacity:.45;cursor:default}
/* 새 페이지 만들기 대화상자: 화면 중앙, 약한 dim, X 없음 */
.adlg{display:none;position:fixed;z-index:70;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);background:rgba(45,38,64,.14);align-items:center;justify-content:center}
.adlg.show{display:flex}
.adlg-box{width:88%;background:#fffefb;border:1px solid #e6e1ef;border-radius:22px;padding:22px 18px 18px;box-shadow:0 6px 24px rgba(45,38,64,.08)}
.adlg-box h3{margin:0 0 16px;font-size:17px;color:#2d2640}
.adlg-box label{display:block;font-size:13px;font-weight:700;color:#6f6889;margin-bottom:6px}
.adlg-box input{border:1px solid #dfe6d8;background:#fcfdf9}
.adlg-box input:focus{border-color:#82b48b;box-shadow:0 0 0 3px #e8f3e0;outline:none}
.adlg-btns{display:flex;gap:10px;margin-top:18px}
.adlg-btns .ar-btn{height:44px}
.adlg-btns .ar-btn.sec,.adlg-btns .ar-btn.pri{flex:1 1 0}
.adlg-btns .ar-btn.sec{border-color:#dcdfd6;color:#556057}
.adlg-btns .ar-btn.sec:active{background:#f4f6f0}
.adlg-btns .ar-btn.pri{background:#bcd9ae;border-color:#bcd9ae;color:#1f4f2b}
.adlg-btns .ar-btn.pri:active{background:#a9cc9a}
.adlg-btns .ar-btn.pri:disabled{background:#eaeee6;border-color:#eaeee6;color:#a3ab9f;opacity:1}
/* Re:Step 메인 = 플래너 표지 */
.cover{text-align:center;padding:2px 0 4px}
.cover-img img{width:min(300px,80%);height:auto;display:block;margin:0 auto}
.cover-title{margin:6px 0 28px;font-size:19px;font-weight:800;letter-spacing:-.01em}
.pl-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fffefb;border:1px solid #e6e1ef;border-radius:18px;padding:14px 16px;margin-bottom:10px;cursor:pointer;font:inherit;color:inherit}
.pl-card:active{background:#faf8fd}
.pl-ico{width:46px;height:46px;flex-shrink:0}
.pl-b{flex:1;min-width:0}
.pl-b h3{margin:0 0 3px;font-size:16px}
.pl-b p{margin:0;font-size:12.5px;color:var(--muted)}
.pl-c{flex-shrink:0;font-size:20px;line-height:1;color:#b4aecb}
.pg-card.mg{cursor:default;gap:8px}
.pg-card.mg.dragging{opacity:.85;box-shadow:0 6px 18px rgba(76,33,83,.16)}
.mg-h{flex-shrink:0;width:28px;text-align:center;font-size:18px;line-height:1;color:#a49cbd;cursor:grab;touch-action:none;user-select:none;padding:6px 0}
.mg-name{flex:1;min-width:0;padding:9px 11px;font-size:14px;border-radius:11px}
.mg-del{flex-shrink:0;border:0;background:transparent;color:var(--danger);font-size:12.5px;font-weight:800;padding:6px 4px}
/* 자기주도 STEP */
.stabs{display:grid;grid-template-columns:repeat(2,1fr);background:#f1eee8;border-radius:999px;padding:4px;margin-bottom:18px}
.stabs button{border:0;background:transparent;border-radius:999px;padding:8px;font-weight:850;color:#6d706b}
.stabs button.active{background:#79ad7c;color:#fff}
.fld{margin-top:14px}
.fld label .opt{font-weight:600;color:var(--muted);margin-left:4px;font-size:11px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1px solid var(--line);background:#fffefb;border-radius:13px;padding:11px 8px;font-weight:800;font-size:13.5px;color:#6d706b}
.seg button.on{background:var(--green-bg);border-color:var(--green);color:var(--green-d)}
.txt-act{font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;padding:4px 2px;flex-shrink:0}
.txt-danger{font-size:12.5px;font-weight:800;color:var(--danger);cursor:pointer;padding:6px 4px}
.kv{padding:11px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0;padding-top:2px}
.kv .k{font-size:11.5px;font-weight:800;color:var(--muted);margin-bottom:3px}
.kv .v{font-size:15px;font-weight:700;overflow-wrap:anywhere;white-space:pre-wrap}
.cl-ico{width:26px;height:26px;flex-shrink:0}
.sd-act{background:#fff;border:1px solid #e3ddf0;border-radius:18px;padding:6px 14px;margin-bottom:22px}
.home-add{background:transparent;border:0;padding:6px 2px 2px;font-size:12.5px;font-weight:700;color:#5f8a63;cursor:pointer}
.conn-meta{font-size:11.5px;color:#7d8a7f}
.rc-card{background:#fffefb;border:1px solid #e6e0f0;border-radius:12px;padding:9px 12px;margin-top:6px}
.rc-t{font-size:13px;font-weight:700;color:var(--ink)}
.rc-m{font-size:13px;font-weight:500;color:#3f4a42;margin-top:2px;overflow-wrap:anywhere}
.rc-m.sub{font-size:11.5px;font-weight:400;color:var(--muted)}
.rc-d{font-size:11px;color:#8a8498;margin-top:3px}
/* 공통 상세 UI shell(.sd): 학습자 기록 상세(.sage) / 파트너 Re:Step 상세(.lav)가 같은 구조를 쓰고 색만 다르다. */
.sd-sum{border:1px solid #e3ddf0;background:#faf8fe;border-radius:16px;padding:14px 16px}
.sd-sum h2{margin:0 0 2px}
.sd-date{font-size:12px;color:var(--muted);margin-bottom:8px}
.sd-sum .row{font-size:13.5px}
.sd.sage .sd-sum{background:#f4f9ef;border-color:#d9e8d0}
.sd.sage .rs-tabs button.active{background:var(--green-bg);color:var(--green-d)}
.sd.sage .rs-card{border-color:#d9e8d0}
.sd.sage .rs-row{border-top-color:#e4eddc}
.sd.sage .rs-n{background:var(--green-bg);color:var(--green-d)}
.sd.sage .rs-dots span.on{background:#7fb487}
.sd.sage .rs-fold{color:var(--green-d)}
.sd.sage .sd-act{border-color:#d9e8d0}
.sd.lav .rs-card{border-color:#e3ddf0}
.rs-bt{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.rs-meta{display:flex;align-items:baseline;gap:8px;margin-top:5px}
.rs-meta .k{flex:0 0 38px;font-size:11.5px;font-weight:600;color:#858a82}
.rs-meta .v{font-size:13px;font-weight:500;line-height:1.5;color:#1f2a22;min-width:0;overflow-wrap:anywhere}
.cheer-note{background:#f3effb;border:1px solid #e3ddf0;border-radius:14px;padding:12px 14px}
.cheer-note .t{font-size:14px;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.cheer-note .d{font-size:11px;color:#8a8498;margin-top:6px}
/* Re:Cheer 메인(받은편지함) + 달력 기록 */
.cs-stage{height:150px;display:flex;align-items:flex-end;justify-content:center;margin-top:4px}
.cs-stage img{width:min(260px,78%);height:auto;max-height:100%;object-fit:contain}
.cs-status{text-align:center;font-size:17px;font-weight:800;color:#4b3b86;margin:8px 0 14px;min-height:24px}
/* Re:Cheer 미연결 메인 */
.cs-stage.wait{height:auto;margin-top:26px}
.cs-stage.wait img{width:min(300px,86%);max-height:none}
.cs-status.soft{font-size:16px;font-weight:600;color:#6a5aa0;margin:10px 0 4px}
.cs-sub{text-align:center;font-size:13px;color:#9089a8;margin:0 0 22px}
.cw-card{background:linear-gradient(145deg,#fcfbff,#f1edfb);border:1px solid #e3ddf0;border-radius:22px;padding:18px 16px 16px;margin:0 2px}
.cw-head{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.cw-ico{width:40px;height:40px;flex:none;display:block}
.cw-title{font-size:16.5px;font-weight:700;color:#4b3b86}
.cw-desc{font-size:12.5px;color:#8a82a3;line-height:1.45;margin-top:2px;word-break:keep-all}
.cw-input{height:48px;border:1px solid #ddd5f0;border-radius:14px;background:#fff;padding:0 14px;font-size:14.5px}
.cw-input::placeholder{color:#aaa3c0}
.cw-input:focus{border-color:#a597d4;box-shadow:0 0 0 3px rgba(130,112,189,.15)}
.cw-btn{display:block;width:100%;height:50px;margin-top:10px;border:0;border-radius:15px;background:#8270bd;color:#fff;font-size:15.5px;font-weight:800;font-family:inherit;cursor:pointer}
.cw-btn:active{background:#6f5eaa}
.cs-hint{text-align:center;font-size:12px;color:#9a93ad;line-height:1.55;margin:0 10px}
/* Re:Cheer 메인: 빈 상태 점선 영역(= 카드가 들어올 자리) + 카드 왼쪽 날짜칩 */
.cs-slot{border:1.5px dashed #ddd8e8;border-radius:14px;background:transparent;padding:20px 12px;min-height:72px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(10.5px,3.2vw,12.5px);line-height:1.6;color:#9a93ad;word-break:keep-all}
.cs-conn{text-align:center;font-size:12px;color:#a8a2ba;margin-top:10px}
.cl-card.chip{gap:12px}
.cl-one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl-chip{flex-shrink:0;min-width:42px;padding:6px 8px;border-radius:11px;background:var(--lav-bg);color:#6d58a8;text-align:center;line-height:1.25}
.cl-chip .m{display:block;font-size:10.5px;font-weight:600;opacity:.8}
.cl-chip .d{display:block;font-size:14px;font-weight:800}
.cc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:#fffefb;border:1px solid #e3ddf0;border-radius:16px;padding:10px 8px}
.cc-dow{text-align:center;font-size:11px;font-weight:600;color:#9a93ad;padding:2px 0 6px}
.cc-cell{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
.cc-day{width:100%;height:100%;max-width:40px;border:0;background:transparent;border-radius:50%;font-size:13px;font-weight:500;color:#9a9588;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;position:relative}
.cc-day.has{color:var(--ink);font-weight:700;cursor:pointer}
.cc-day.today span{box-shadow:inset 0 -2px 0 #cfc6e8}
.cc-day.sel{background:var(--lav-bg);color:#4b3b86}
.cc-day{cursor:pointer}
.cc-dot{display:block;width:5px;height:5px;border-radius:50%;background:var(--lav)}

.nt-card{display:flex;align-items:center;gap:12px;background:#faf8fe;border:1px solid #e3ddf0;border-radius:16px;padding:11px 13px;margin-bottom:8px;cursor:pointer}
.nt-card:active{background:#f3effb}
.nt-ico{width:40px;height:40px;flex-shrink:0;object-fit:contain}
.nt-b{flex:1;min-width:0}
.nt-t{font-size:15px;font-weight:800;color:#2d2640}
.nt-s{font-size:13px;color:#6f6889;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt-chev{flex-shrink:0;width:18px;height:18px}
.nt-close{display:block;width:100%;margin-top:14px;height:46px;border-radius:15px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;border:1px solid #ebe6da;background:#f2efe8;color:#45433d}
.nt-close:active{background:#e8e4d9}
/* 연결 관계 관리 / 알림 요청 카드 공통 */
.cx-card{border:1px solid #d6e6cc;background:#edf7e9;border-radius:18px;padding:15px;margin-bottom:12px}
.cx-card.lav{background:#f1edfb;border-color:#e3ddf0}
.cx-head{display:flex;align-items:center;gap:13px}
.cx-ico{width:48px;height:48px;flex:none;display:block}
.cx-b{flex:1;min-width:0}
.cx-h{font-size:16.5px;font-weight:600;color:var(--ink);line-height:1.3}
.cx-s{font-size:13.5px;font-weight:400;color:#6b7a6e;line-height:1.5;margin-top:4px}
.cx-card.lav .cx-s{color:#7a7197}
.cx-act{display:flex;gap:8px;margin-top:13px}
.cx-btn{height:36px;padding:0 16px;border-radius:12px;font-size:13.5px;font-weight:800;font-family:inherit;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.cx-act .cx-btn{flex:1}
.cx-btn.sec{background:#fffdf8;border-color:#dcd6c8;color:#45433d}
.cx-btn.sec:active{background:#f2efe8}
.cx-btn.pri{background:#5b9a68;border-color:#5b9a68;color:#fff}
.cx-btn.pri:active{background:#4d8859}
.cx-code{display:flex;gap:8px;margin-top:13px}
.cx-code-v{flex:1;min-width:0;height:44px;display:flex;align-items:center;justify-content:center;background:#fffdf8;border:1px solid #d6e6cc;border-radius:12px;font-size:19px;font-weight:900;letter-spacing:.06em;color:#2f4a35}
.cx-code .cx-btn{height:44px;background:#e3f0da;border-color:#cfe3c3;color:#2f6a3d}
.cx-code .cx-btn:active{background:#d3e6c8}
.cx-rel{display:flex;align-items:center;gap:13px}
.cx-lab{font-size:12.5px;font-weight:500;color:#6b7a6e}
.cx-card.lav .cx-lab{color:#7d7790}
.cx-name{font-size:15.5px;font-weight:500;color:var(--ink);margin-top:3px;word-break:break-all}
.cx-mutual{display:flex;align-items:center;gap:13px;background:#fffdf8;border:1px solid var(--line);border-radius:18px;padding:14px 15px;margin-bottom:6px}
.cx-heart{width:46px;height:auto;flex:none;display:block}
.cx-sec{font-size:12px;font-weight:800;color:#8a8576;margin:14px 2px 7px}
.rec-x{flex-shrink:0;margin:-4px -6px 0 0;padding:2px 8px;font-size:17px;line-height:1.2;color:#b9b3a4;cursor:pointer}







.summary-card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px 14px;margin-bottom:10px;box-shadow:0 4px 14px rgba(61,73,57,.05)}
.summary-card.new-item{border-left:4px solid #f6ccd6}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{border:1px solid var(--line);background:#fff;border-radius:17px;padding:12px;text-align:center}
.stat strong{display:block;font-size:21px;margin-top:5px}
.stage-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.stage{font-size:10.5px;font-weight:850;padding:8px 4px;border-radius:10px;background:#f1efea;color:#777;text-align:center;line-height:1.3}
.stage.done{color:#3d7a48}
.help-list{display:grid;gap:10px}
.help-item{background:#faf8f3;border:1px solid var(--line);border-radius:16px;padding:13px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.quick button{border:1px solid var(--line);background:#fff;border-radius:14px;height:46px;padding:0 8px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.25;overflow:hidden;font-size:13px;font-weight:500;color:var(--muted)}
.quick button.selected{background:var(--lav-bg);border-color:#a899d3;color:#6d58a8}
.badge{position:absolute;top:2px;right:2px;min-width:16px;height:16px;border-radius:999px;background:#dd6f7c;color:#fff;font-size:9px;font-weight:950;display:none;align-items:center;justify-content:center;padding:0 3px}
.modal{display:none;position:fixed;z-index:60;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);background:rgba(32,37,32,.3);align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{width:min(430px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:27px 27px 0 0;padding:20px 18px 30px;
scrollbar-width:thin;scrollbar-color:#d6d1c4 transparent}
.sheet::-webkit-scrollbar{width:8px}
.sheet::-webkit-scrollbar-track{background:transparent;margin:32px 4px}
.sheet::-webkit-scrollbar-thumb{background-color:#d6d1c4;border-radius:999px;border:2px solid #fff;background-clip:padding-box}
.sheet::-webkit-scrollbar-thumb:hover{background-color:#b7b2a3}
.sheet h3{font-size:20px}
.manage-row{display:grid;grid-template-columns:1fr auto auto;gap:7px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.toast{position:fixed;z-index:100;top:18px;left:50%;transform:translate(-50%,-13px);opacity:0;pointer-events:none;
background:#26372b;color:#fff;border-radius:12px;padding:10px 14px;font-size:12px;font-weight:850;transition:.18s}
.toast.show{opacity:1;transform:translate(-50%,0)}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
@media(min-width:700px){ body{padding:22px 0} .app{border-radius:28px;overflow:hidden;min-height:calc(100vh - 44px)} }
</style>
</head>
<body>
<div class="app">

  <section id="loginScreen" class="screen active">
    <div class="login">
      <div class="brand">Re:Step</div>
      <p class="subtle">공부한 만큼,<br>다시 한 걸음.</p>
      <div class="sprout">🌱</div>
      <input id="email" type="email" placeholder="이메일 주소">
      <button id="sendBtn" class="btn primary full">매직링크 보내기</button>
      <p id="loginMsg" class="subtle" style="margin-top:13px"></p>
    </div>
  </section>

  <section id="pushPromptScreen" class="screen">
    <div class="login">
      <div class="sprout">🔔</div>
      <h2>짝꿍이 Re:Step/Re:Cheer를<br>보내면 바로 알려드릴게요</h2>
      <button id="pushPromptAllow" class="btn primary full" style="margin-top:24px">알림 받기</button>
      <button id="pushPromptLater" class="btn secondary full" style="margin-top:8px">나중에</button>
    </div>
  </section>

  <section id="nameSetupScreen" class="screen">
    <div class="login">
      <div class="sprout">🌱</div>
      <h2>당신을 뭐라고<br>부르면 좋을까요?</h2>
      <p class="subtle">응원 파트너에게 이 이름으로 보여요.</p>
      <input id="displayNameInput" placeholder="이름 또는 별명" style="margin-top:16px">
      <button id="saveNameBtn" class="btn primary full" style="margin-top:10px">저장하고 시작하기</button>
    </div>
  </section>

  <section id="homeScreen" class="screen">
    <!-- 공통 header: 좌측 navigation(홈은 없음) / 중앙 로고 이미지 / 우측 action. 로고는 header 전체 폭 기준 정확히 가운데(absolute)라 아이콘 개수와 무관 -->
    <div class="hdr">
      <div class="hdr-logo"><img id="logoStep" src="restep_logo.png" alt="Re:Step"><img id="logoCheer" src="recheer_logo.png" alt="Re:Cheer" style="display:none"></div>
      <div class="hdr-right">
        <button id="notifBtn" class="hdr-btn" aria-label="알림" title="알림"><img src="icon_bell.png" alt=""><span id="notifBadge" class="badge"></span></button>
        <button id="calBtn" class="hdr-btn" style="display:none" aria-label="Re:Cheer 기록" title="Re:Cheer 기록"><img src="icon_calendar.png" alt=""></button>
        <button id="settingsBtn" class="hdr-btn" aria-label="설정" title="설정"><img src="icon_settings.png" alt=""></button>
      </div>
    </div>
    <div class="mode">
      <button data-role="learner" class="active">학습자</button>
      <button data-role="partner">응원 파트너</button>
    </div>

    <div id="learnerHome" style="margin-top:16px">
      <!-- 스터디 플래너의 표지: 어떤 종류의 학습을 할지 고른다(두 영역은 동등). 과거 기록/현황은 여기 두지 않음 -->
      <div class="cover">
        <div class="cover-img"><img src="restep_study_anim.webp" alt=""></div>
        <h2 class="cover-title">오늘은 어떤 학습을 할까요?</h2>
        <button class="pl-card" data-area="study"><img class="pl-ico" src="icon_book.png" alt=""><div class="pl-b"><h3>전공 / 교과 학습</h3><p>STUDY로 학습하고 복습해요.</p></div><span class="pl-c">›</span></button>
        <button class="pl-card" data-area="self"><img class="pl-ico" src="icon_sprout.png" alt=""><div class="pl-b"><h3>자기주도 학습</h3><p>STEP으로 나만의 활동을 기록해요.</p></div><span class="pl-c">›</span></button>
      </div>
    </div>

    <div id="partnerHome" style="display:none;margin-top:16px">
      <div id="partnerBody"></div>
    </div>
  </section>

  <section id="areaScreen" class="screen">
    <!-- 공통 header: 좌측 뒤로가기 / 중앙 Re:Step 로고(정중앙) / 우측 알림·설정. 알림·설정은 홈 header 버튼과 같은 동작을 그대로 연결 -->
    <div class="hdr">
      <button id="areaBackBtn" class="hdr-btn hdr-back" aria-label="뒤로"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4c2153" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="hdr-logo"><img src="restep_logo.png" alt="Re:Step"></div>
      <div class="hdr-right">
        <button id="areaNotifBtn" class="hdr-btn" aria-label="알림" title="알림"><img src="icon_bell.png" alt=""><span id="areaNotifBadge" class="badge"></span></button>
        <button id="areaSettingsBtn" class="hdr-btn" aria-label="설정" title="설정"><img src="icon_settings.png" alt=""></button>
      </div>
    </div>
    <!-- 플래너 목차: 전공/교과와 자기주도가 같은 화면·같은 컴포넌트(아이콘·단위·문구만 다름). 큰 색 패널로 감싸지 않음 -->
    <div class="ar-intro">
      <h2 id="areaTitle" class="ar-title"></h2>
      <div class="ar-deco-box"><img id="areaDeco" class="ar-deco" alt=""></div>
    </div>
    <div id="areaList"></div>
    <!-- 하단 action: 리스트 바로 아래(고정 아님). 관리 35% secondary / 만들기 65% primary -->
    <div class="ar-actions">
      <button id="areaManageBtn" class="ar-btn sec">관리</button>
      <button id="areaAddBtn" class="ar-btn pri"></button>
    </div>
  </section>

  <section id="stepScreen" class="screen">
    <div class="topbar">
      <button id="stepBackBtn" class="iconbtn">←</button>
      <div style="text-align:center"><h2 id="stepPageTitle" style="margin:0"></h2></div>

async function openLearnerCheerTarget(summaryId, ctx){
  // 뒤로가기: 알림함/작업 중 화면 등 호출부가 넘긴 경로가 우선, 없으면(앱이 꺼져 있다가 푸시로 진입) 학습자 홈.
  const back = (ctx && ctx.onBack) || (() => { setRole('learner'); screen('homeScreen'); loadPages(); });
  const { data: s } = await client.from('cheer_summaries').select('id, session_id, study_day_number_snapshot').eq('id', summaryId).eq('learner_user_id', currentUserId).maybeSingle();
  if(!s){ toast('이 Re:Cheer는 더 이상 확인할 수 없어요.'); return false; }
  if(s.study_day_number_snapshot){
    const { data: sess } = await client.from('study_sessions').select('page_id, step_number').eq('id', s.session_id).maybeSingle();

      const { data: day } = await client.from('study_days').select('*, study_day_items(*)').eq('page_id', sess.page_id).eq('created_step', sess.step_number).maybeSingle();
      const { data: pg } = await client.from('study_pages').select('*').eq('id', sess.page_id).maybeSingle();
      if(day && pg){
        await renderStudyDayDetail(day, pg, back, null, null, true);
        return true;
      }
    }
  }
  // 복습-only 세션이거나 원본 STUDY가 삭제된 경우: 발송 당시 Re:Step 발송본(읽기 전용) — 학습자도 같은 발송본을 읽는다

}

async function handleNotificationTarget(target, ctx){
  if(!target || !target.type) return;
  if(target.type === 'restep'){
    setRole('partner');
    // 뒤로가기 기본값(ctx 없음 = 푸시로 앱을 처음 연 경우): 응원 파트너 홈
    const ok = await openSummary(target.summary_id, { onBack: (ctx && ctx.onBack) || (() => { setRole('partner'); screen('homeScreen'); loadCheerSection(); }) });
    if(ok === true) markNotifRead('step:' + target.summary_id); // 상세가 실제로 열렸을 때만 그 알림만 읽음 처리
  } else if(target.type === 're_cheer'){
    setRole('learner');
    const ok = await openLearnerCheerTarget(target.summary_id, ctx);
    if(ok === true) markNotifRead('cheer:' + target.summary_id);
  } else if(target.type === 'disconnected'){
    await openConnectionSettings({ linkId: target.link_id, role: target.role });
  } else if(target.type === 'notif'){
    setRole('learner');
    $('notifBtn').click();
  } else if(target.type === 'monthly_recap'){
    await openPreviousMonthRecap(); // 알림 모달 안 거치고 바로 지난달 리포트로
  }
}

    screenId: active ? active.id : 'homeScreen', role: currentRole, scrollY: window.scrollY,
    modalOpen: $('modal').classList.contains('show'),
    prevDetailBack: DETAIL_SCREENS.includes(active && active.id) && detailNav ? detailNav.fn : null

function restoreViewState(st){
  if(st.prevDetailBack){ st.prevDetailBack(); return; } // 보던 게 다른 상세였다면 그 상세의 원래 뒤로가기 경로로
  setRole(st.role); // 푸시 상세(파트너)를 보는 동안 바뀐 역할도 원래대로(학습자 작업 화면에 파트너 로고/아이콘이 남지 않게)
  screen(st.screenId);
  if(st.modalOpen) $('modal').classList.add('show');
  setTimeout(() => window.scrollTo(0, st.scrollY), 30);
}
function handlePushWhileActive(url){
  let params; try{ params = new URL(url, location.href).searchParams; }catch(e){ return; }
  const type = params.get('open'); if(!type) return;
  const target = { type, summary_id: params.get('summary_id'), link_id: params.get('link_id'), role: params.get('role') };
  const st = captureViewState();
  if(st.modalOpen) $('modal').classList.remove('show'); // 열려 있던 모달은 내용을 지우지 않고 가렸다가 돌아올 때 다시 보여줌
  handleNotificationTarget(target, { onBack: () => restoreViewState(st) });
}
if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('message', e => {
    if(e.data && e.data.type === 'restep-notif-click' && e.data.url) handlePushWhileActive(e.data.url);
  });
}
// 기기 알림을 눌러서 들어왔을 때 URL(?open=타입&...)에서 대상 정보를 꺼내 라우터에 그대로 넘김.

// ===== 작업 화면 상태의 보존/복원 (푸시로 앱이 다시 시작돼도 하던 일로 돌아가기 위함) =====
// 판단 기준은 "앱이 foreground였나"가 아니라 "복원할 작업 화면 상태가 남아 있나". 학습 페이지(작성/복습 중 화면)에 있는 동안
// 서브탭·폼 펼침·입력 중이던 값·스크롤을 주기적으로 localStorage에 적어두고, 푸시 진입 후 뒤로가기 때 거기로 복원한다.
// (진행 중인 세션, 복습 체크, 저장된 새 학습은 원래 서버에 있어서 그대로 유지됨.) 오래된 상태(2시간 초과)는 쓰지 않고,
// 홈으로 나가면 지운다. 경로 정보는 DB에 저장하지 않는다.
const WORK_STATE_KEY = 'restep-work-state';
const WORK_STATE_TTL = 2 * 60 * 60 * 1000;
function saveWorkState(){
  try{
    if(!currentUserId || !currentPageId) return;
    const active = document.querySelector('.screen.active');
    if(!active || active.id !== 'pageScreen') return; // 상세 등으로 나가 있는 동안엔 마지막으로 저장한 작업 상태를 유지
    captureDraftForm();
    const tabBtn = document.querySelector('.tabs button.active');
    localStorage.setItem(WORK_STATE_KEY, JSON.stringify({
      ts: Date.now(), uid: currentUserId, pageId: currentPageId, tab: tabBtn ? tabBtn.dataset.tab : 'today',
      sub: studySubTab, formOpen: draftFormOpen, form: draftFormValues, editing: editingDraftIndex, scrollY: window.scrollY
    }));
  }catch(e){}
}
function readWorkState(){
  try{
    const st = JSON.parse(localStorage.getItem(WORK_STATE_KEY) || 'null');
    if(!st || st.uid !== currentUserId || Date.now() - st.ts > WORK_STATE_TTL) return null;
    return st;
  }catch(e){ return null; }
}
function clearWorkState(){ try{ localStorage.removeItem(WORK_STATE_KEY); }catch(e){} }
async function restoreWorkState(st){
  clearWorkState();
  setRole('learner');
  if(!pagesCache.some(p=>p.id===st.pageId)) await loadPages();
  if(!pagesCache.some(p=>p.id===st.pageId)){ screen('homeScreen'); return; } // 그 사이 페이지가 없어졌다면 홈

async function loadPages(){

    if(!stErr) (steps||[]).forEach(t => {

// 관리 모드에서만 ☰ 손잡이로 끌어서 순서를 바꾼다(놓는 순간 저장)
function wireAreaDrag(){
  const box = $('areaList');
  box.querySelectorAll('[data-handle]').forEach(h => h.addEventListener('pointerdown', e => {
    e.preventDefault();
    const row = h.closest('.pg-card'); row.classList.add('dragging');
    const move = ev => {
      const others = [...box.querySelectorAll('.pg-card')].filter(r => r !== row);
      const before = others.find(r => { const b = r.getBoundingClientRect(); return ev.clientY < b.top + b.height/2; });
      if(before) box.insertBefore(row, before); else box.appendChild(row);
    };
    const up = async () => {
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
      row.classList.remove('dragging');
      await persistAreaOrder();
    };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  }));
}
async function persistAreaOrder(){
  const ids = [...$('areaList').querySelectorAll('.pg-card')].map(r => r.dataset.id);
  const list = areaList();
  const changed = ids.map((id,i) => ({ id, i })).filter(x => (list.find(p=>p.id===x.id)||{}).position !== x.i);
  if(!changed.length) return;
  const results = await Promise.all(changed.map(x => client.from('study_pages').update({ position:x.i }).eq('id', x.id)));
  if(results.some(r => r.error)) toast('❌ 순서를 저장하지 못했어요.');
  await loadPages();
}

// ===== 자기주도 STEP =====
// 복습 없음. 한 페이지에 진행 중인 STEP은 하나. 활동명 + 인증 여부가 있으면 마감할 수 있다(별도 "활동 완료" 체크 없음 — 마감이 곧 완료).
// 입력은 자동 저장(진행 중 행을 직접 update), 시작/마감/취소는 RPC. 마감한 STEP은 기록 탭에서 수정·삭제할 수 있다.
let stepPage = null;      // 지금 보고 있는 자기주도 페이지
let stepRow = null;       // 진행 중 STEP(DB 행) 또는 null
let stepDirty = false, stepSaveTimer = null;
let stepRecordsCache = [];
const DB_NEED = '자기주도 STEP은 DB 준비(SQL 실행)가 필요해요.';
const stepDbMissing = e => !!e && (e.code === '42P01' || e.code === 'PGRST205' || /self_steps|schema cache|does not exist|step_count/i.test(e.message || ''));
const fmtYMD = ts => new Date(ts).toLocaleDateString('ko-KR', { timeZone:'Asia/Seoul', year:'numeric', month:'numeric', day:'numeric' });

function stepFieldsHtml(pre, v){
  return `
    <div class="fld"><label>활동명</label><input id="${pre}Name" maxlength="60" placeholder="예: 저녁 러닝" value="${escapeHtml(v.activity_name || '')}"></div>

async function renderStepTab(){
  const box = $('stepTab'), page = stepPage;
  if(!page) return;
  if(isOffline){ box.innerHTML = `<div class="notice offline"><b>오프라인 읽기 전용</b><br>STEP 시작·기록·마감은 온라인에서만 할 수 있어요.</div>`; return; }

  stepRow = row; stepDirty = false;

  }
  box.innerHTML = `<div class="card green">
      <div class="row"><span class="pill">STEP ${row.step_number} 진행 중 · ${fmtYMD(row.started_at)} 시작</span><span class="txt-act" id="cancelStepBtn">STEP 취소</span></div>
      ${stepFieldsHtml('step', row)}

    refreshClose(); stepDirty = true; $('stepSaveState').textContent = '저장 중…';
    clearTimeout(stepSaveTimer); stepSaveTimer = setTimeout(flushStepSave, 700);
  });
  $('closeStepBtn').onclick = async () => { await flushStepSave(); openCloseStepScreen(row.id); };
  $('cancelStepBtn').onclick = () => confirmCancelStep(row);

async function flushStepSave(){
  clearTimeout(stepSaveTimer);
  if(!stepDirty || !stepRow || !$('stepName')) return;
  const v = readStepFields('step'); stepDirty = false;
  const { error } = await client.from('self_steps').update({ ...v, updated_at: new Date().toISOString() }).eq('id', stepRow.id);
  const el = $('stepSaveState');
  if(error){ stepDirty = true; if(el) el.textContent = '저장하지 못했어요. 연결을 확인해주세요.'; }

function confirmCancelStep(row){

    closeModal(); stepRow = null; stepDirty = false; toast('STEP을 취소했어요.');
    await renderStepTab(); loadPages();

  showModal(`<h3 style="margin-bottom:2px">${escapeHtml(stepPage.name)} · STEP ${t.step_number} 수정</h3>
    ${t.summary_id ? '<div class="subtle" style="margin-top:6px">이미 보낸 Re:Step은 바뀌지 않아요.</div>' : ''}
    ${stepFieldsHtml('rec', t)}
    <div class="stack" style="margin-top:18px"><button class="btn primary full" id="recSave">저장</button><button class="btn secondary full" id="recClose">닫기</button></div>`);
  const original = JSON.stringify({ activity_name:t.activity_name, amount_text:t.amount_text, verified:t.verified, memo:t.memo });
  const isDirty = () => JSON.stringify(readStepFields('rec')) !== original;
  wireStepFields('rec', () => {});
  modalDirtyGuard = () => { if(isDirty()) toast('저장하지 않은 변경이 있어요. 저장하거나 닫기를 눌러주세요.'); else closeModal(); };
  $('recClose').onclick = closeModal;

    const v = readStepFields('rec');

// ===== 복습 큐 알고리즘 =====
function dueGroups(checkpoints, nextStep){
  const due = checkpoints.filter(r => r.due_step <= nextStep);
  const map = {};
  due.forEach(r => { (map[r.study_day_id] = map[r.study_day_id] || []).push(r); });
  return Object.entries(map).map(([studyDayId, rs]) => {
    const exact = rs.filter(r => r.due_step === nextStep);
    return {
      studyDayId, rs,
      stageIndices: rs.map(r=>r.stage_index).sort((a,b)=>a-b),
      regular: exact.length>0,
      exactPriority: exact.length ? Math.min(...exact.map(r=>r.stage_index)) : 99,
      overduePriority: Math.min(...rs.map(r=>r.stage_index)),
      oldestDelay: Math.max(...rs.map(r=>nextStep-r.due_step)),
      maxMiss: Math.max(...rs.map(r=>r.exclusion_count||0))
    };
  });
}
function chooseQueue(checkpoints, daysById, nextStep){
  const gs = dueGroups(checkpoints, nextStep);
  const regular = gs.filter(g=>g.regular).sort((a,b)=>a.exactPriority-b.exactPriority || (daysById[a.studyDayId].day_number - daysById[b.studyDayId].day_number));
  const late = gs.filter(g=>!g.regular).sort((a,b)=>b.oldestDelay-a.oldestDelay || a.overduePriority-b.overduePriority);
  const protectedLate = late.filter(g=>g.maxMiss>=3).sort((a,b)=>b.maxMiss-a.maxMiss || b.oldestDelay-a.oldestDelay || a.overduePriority-b.overduePriority);
  let selected = [];
  if(regular.length >= 10){
    selected = protectedLate.length ? regular.slice(0,9).concat(protectedLate[0]) : regular.slice(0,10);
  } else {
    selected = regular.slice();
    let pool = late.slice();
    if(protectedLate.length){
      const protect = protectedLate[0];
      if(!selected.some(x=>x.studyDayId===protect.studyDayId)){ selected.push(protect); pool = pool.filter(x=>x.studyDayId!==protect.studyDayId); }
    }
    for(const g of pool){ if(selected.length>=10) break; if(!selected.some(x=>x.studyDayId===g.studyDayId)) selected.push(g); }
  }
  return { all: gs, selected };
}

async function startSession(page){
  toast('복습 큐 계산 중...');
  const { data: days } = await client.from('study_days').select('*').eq('page_id', page.id);
  const dayIds = days.map(d=>d.id);
  const { data: checkpoints } = dayIds.length
    ? await client.from('review_checkpoints').select('*').in('study_day_id', dayIds).eq('status','pending')
    : { data: [] };
  const daysById = Object.fromEntries(days.map(d=>[d.id,d]));
  const nextStep = (page.review_step||0) + 1;
  const { all, selected } = chooseQueue(checkpoints, daysById, nextStep);
  const selectedIds = new Set(selected.map(g=>g.studyDayId));
  const allCheckpointIds = all.flatMap(g=>g.rs.map(r=>r.id));
  const selectedCheckpointIds = all.filter(g=>selectedIds.has(g.studyDayId)).flatMap(g=>g.rs.map(r=>r.id));
  const queue = selected.map(g=>({ studyDayId: g.studyDayId, stageIndices: g.stageIndices, regular: g.regular, completed:false }));

  const { data, error } = await client.rpc('start_study_session_with_queue', {
    p_page_id: page.id, p_device_id: deviceId, p_queue: queue,
    p_checkpoint_ids: allCheckpointIds, p_selected_ids: selectedCheckpointIds
  });
  if(error){ toast('❌ ' + error.message); return; }
  renderSessionPanel(page, data);
}
