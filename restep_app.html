  return connReqCardHtml({
    name: labelFor(requesterProfile),
    cardAttr: `data-request-card="${link.id}"`,
    rejectAttr: `data-reject-request="${link.id}"`,
    acceptAttr: alreadyConnected ? '' : `data-accept-request="${link.id}"`,
    blockedBtn: `<button class="cx-btn sec" data-manage-request="${link.id}">연결 관계 관리</button>`,
    note: alreadyConnected ? '이미 연결된 파트너가 있어 바로 연결할 수 없어요.' : ''
  });
}
async function openNotifModal(restoreScroll){
  const uid = currentUserId;
  // 알림함은 지금 보고 있는 역할의 알림만 보여준다: 학습자 = 연결 요청 + 받은 Re:Cheer, 응원 파트너 = 새 Re:Step.
  const role = currentRole;
  const { data: learnerLinks } = role === 'learner' ? await client.from('cheer_links').select('*').eq('learner_user_id', uid).eq('status','requested') : { data: [] };
  const { data: partnerLinks } = role === 'partner' ? await client.from('cheer_links').select('*').eq('partner_user_id', uid).eq('status','connected') : { data: [] };
  let pendingSummaries = [];
  if((partnerLinks||[]).length){
    const { data: summaries } = await client.from('cheer_summaries').select('*, cheer_messages(*)').eq('learner_user_id', partnerLinks[0].learner_user_id).order('created_at', {ascending:false});
    // 이미 열어본(읽은) Re:Step은 알림함에서 빠진다. 아직 응원 안 한 건 응원 파트너 홈의 Re:Cheer 현황에 계속 남아 있음.
    const readStep = getNotifRead();
    pendingSummaries = (summaries||[]).filter(s=>!oneMsg(s.cheer_messages) && !readStep.has('step:'+s.id));
  }
  // 지금 연결된 파트너가 보낸 것만 — 연결 끊긴 과거 파트너의 메시지가 알림 목록에 뒤늦게 튀어나오지 않도록
  const myLearnerLink = role === 'learner' ? await getMyConnectedLink() : null;
  let newCheers = [];
  if(myLearnerLink){
    const lastSeen = getLastSeenCheer();
    const { data } = await client
      .from('cheer_messages')
      .select(`*, cheer_summaries!inner(page_name_snapshot, study_day_number_snapshot, learner_user_id${SUMX})`)
      .eq('cheer_summaries.learner_user_id', uid)
      .eq('partner_user_id', myLearnerLink.partner_user_id)
      .gt('created_at', lastSeen)
      .order('created_at', {ascending:false});
    // 열어본(읽은) Re:Cheer는 알림함에서 빠진다(해당 STUDY 기록 상세의 '받은 Re:Cheer'에서 계속 확인 가능).
    const readSet0 = getNotifRead();
    newCheers = (data || []).filter(c => !readSet0.has('cheer:'+c.summary_id));
  }

  // 알림함 = 정보 중심의 간결한 목록(캐릭터 없음). 카드 전체가 눌리고, 오른쪽 ›는 눌린다는 표시일 뿐.
  const ntIcon = s => (s && s.kind === 'self') ? 'icon_sprout_small.png' : 'icon_book_small.png';
  const ntCard = (attr, id, s, line) => `<div class="nt-card" ${attr}="${id}"><img class="nt-ico" src="${ntIcon(s)}" alt=""><div class="nt-b"><div class="nt-t">${sumLabel(s)}</div><div class="nt-s">${line}</div></div><svg class="nt-chev" viewBox="0 0 24 24" fill="none" stroke="#a49cbd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></div>`;
  let html = `<h3 style="margin-bottom:14px">알림</h3>`;
  if((learnerLinks||[]).length){
    const cards = await Promise.all((learnerLinks||[]).map(link => renderNotifIncomingCard(link, !!myLearnerLink)));
    html += cards.join('');
  }
  if(pendingSummaries.length){
    html += pendingSummaries.map(s => ntCard('data-notif-summary', s.id, s, '아직 응원을 안 보냈어요.')).join('');
  }
  if(newCheers.length){
    html += newCheers.map(c => ntCard('data-notif-cheer', c.summary_id, c.cheer_summaries, `"${escapeHtml(c.message)}"`)).join('');
  }
  if(!(learnerLinks||[]).length && !pendingSummaries.length && !newCheers.length) html += '<p class="subtle">새 알림이 없어요.</p>';
  html += `<button id="closeNotif" class="nt-close">닫기</button>`;
  showModal(html);
  $('sheet').style.background = '#fffdf8'; // 알림함은 따뜻한 크림 바탕
  // 알림을 눌러 들어간 상세에서 ←를 누르면 이 알림함으로(보던 스크롤 위치까지) 돌아온다.
  // 읽음 처리는 handleNotificationTarget이 상세가 실제로 열린 뒤에 그 알림만 처리.
  const openFromBell = (target, el) => {
    const savedScroll = $('sheet').scrollTop, role = currentRole;
    closeModal();
    handleNotificationTarget(target, { onBack: () => { setRole(role); screen('homeScreen'); openNotifModal(savedScroll); } });
  };
  document.querySelectorAll('[data-notif-summary]').forEach(el=>{
    el.onclick = () => openFromBell({ type: 'restep', summary_id: el.dataset.notifSummary }, el);
  });
  document.querySelectorAll('[data-notif-cheer]').forEach(el=>{
    el.onclick = () => openFromBell({ type: 're_cheer', summary_id: el.dataset.notifCheer }, el);
  });
  document.querySelectorAll('[data-accept-request]').forEach(btn=>{
    btn.onclick = async () => {
      const linkId = btn.dataset.acceptRequest;
      const { error } = await client.rpc('accept_partner_connection', { p_link_id: linkId });
      if(error){ toast('❌ ' + error.message); return; }
      toast('연결됐어요 💜');
      document.querySelector(`[data-request-card="${linkId}"]`)?.remove();
      updateNotifBadge();
      updateLearnerConnStatus();
      loadReceivedCheers();
    };
  });
  document.querySelectorAll('[data-reject-request]').forEach(btn=>{
    btn.onclick = async () => {
      const linkId = btn.dataset.rejectRequest;
      const { error } = await client.from('cheer_links').delete().eq('id', linkId);
      if(error){ toast('❌ ' + error.message); return; }
      toast('요청을 거절했어요.');
      document.querySelector(`[data-request-card="${linkId}"]`)?.remove();
      updateNotifBadge();
    };
  });
  document.querySelectorAll('[data-manage-request]').forEach(btn=>{
    btn.onclick = () => { closeModal(); openConnectionSettings(); };
  });
  updateNotifBadge();
  $('closeNotif').onclick = closeModal;
  if(restoreScroll) requestAnimationFrame(() => { $('sheet').scrollTop = restoreScroll; });
}

// ===== 푸시 알림 =====
const VAPID_PUBLIC_KEY = 'BHCRhvWkDw9hShCu9bEP0ETRa7bTjRIeylLPpx-WyQPrSCj1cDWpbt9pyAOth_7Pb37xuJr0YMffu8eyD0hsT2A';
function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}
async function getCurrentPushSubscription(){
  try{
    if(!('serviceWorker' in navigator)) return null;
    const reg = await navigator.serviceWorker.getRegistration();
    if(!reg) return null;
    return await reg.pushManager.getSubscription();
  }catch(e){ return null; }
}
async function enablePush(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)){
    toast('이 브라우저/환경은 푸시 알림을 지원하지 않아요.');
    return false;
  }
  try{
    const reg = await navigator.serviceWorker.register('sw.js');
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){ toast('알림 권한이 거부됐어요.'); return false; }
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
    });
    const json = sub.toJSON();
    const { error } = await client.from('push_subscriptions').upsert({
      user_id: currentUserId, endpoint: json.endpoint, p256dh: json.keys.p256dh, auth: json.keys.auth
    }, { onConflict: 'endpoint' });
    if(error){ toast('❌ ' + error.message); return false; }
    toast('알림이 켜졌어요 🔔');
    return true;
  }catch(e){
    toast('❌ ' + e.message);
    return false;
  }
}
async function disablePush(sub){
  try{
    const endpoint = sub.endpoint;
    await sub.unsubscribe();
    await client.from('push_subscriptions').delete().eq('endpoint', endpoint);
    toast('알림을 껐어요.');
  }catch(e){
    toast('❌ ' + e.message);
  }
}

async function openConnectionSettings(highlight){
  const uid = currentUserId;
  const { data: asLearner } = await client.from('cheer_links').select('*').eq('learner_user_id', uid);
  const { data: asPartner } = await client.from('cheer_links').select('*').eq('partner_user_id', uid);
  const { data: myProfile } = await client.from('profiles').select('invite_code').eq('id', uid).single();
  const incoming = (asLearner||[]).filter(l=>l.status==='requested');
  const learnerLink = (asLearner||[]).find(l=>l.status==='connected');
  const partnerLink = (asPartner||[]).find(l=>l.status==='connected');
  const mutual = learnerLink && partnerLink && learnerLink.partner_user_id === partnerLink.learner_user_id;

  let learnerProfile=null, partnerProfile=null;
  if(learnerLink) learnerProfile = await fetchProfile(learnerLink.partner_user_id);
  if(partnerLink) partnerProfile = await fetchProfile(partnerLink.learner_user_id);
  // 연결 요청 카드에 '누군가' 대신 요청한 사람의 이름을 보여주기 위해 요청자 프로필을 미리 조회
  const incomingProfile = incoming.length ? await fetchProfile(incoming[0].partner_user_id) : null;

  let html = `<button class="smallbtn" id="backToMenu">← 뒤로</button><h3 style="margin-top:10px">연결 관계 관리</h3>`;

  // 연결 해제 알림을 타고 들어온 경우 — 제목(무엇이 바뀌었나)+설명(어느 방향이 사라졌나) 2단으로 안내.
  // 같은 상대와 반대 방향 연결이 아직 살아있으면 "해제"가 아니라 "변경"으로 구분해서,
  // 관계 전체가 끝난 것처럼 오해하지 않게 함.
  if(highlight && highlight.linkId){
    const { data: deadLink } = await client.from('cheer_links').select('*').eq('id', highlight.linkId).single();
    if(deadLink){
      const counterpartId = highlight.role === 'learner' ? deadLink.partner_user_id : deadLink.learner_user_id;
      const counterpartProfile = await fetchProfile(counterpartId);
      const name = escapeHtml(counterpartProfile?.display_name || '상대방');
      const otherActive = highlight.role === 'learner'
        ? !!(partnerLink && partnerLink.learner_user_id === counterpartId)
        : !!(learnerLink && learnerLink.partner_user_id === counterpartId);
      const noticeTitle = otherActive ? `${name}님과의 응원 관계가 변경되었어요` : `${name}님과의 연결이 해제되었어요`;
      const noticeDesc = highlight.role === 'learner'
        ? `${name}님은 이제 내 Re:Step을 받지 않아요.`
        : `이제 ${name}님의 Re:Step을 받을 수 없어요.`;
      html += `<div style="background:#f5f2ec;border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:14px">
        <div style="font-size:14.5px;font-weight:850">${noticeTitle}</div>
        <div class="subtle" style="margin-top:6px;font-size:12px">${noticeDesc}</div>
      </div>`;
    }
  }

  // 상태 전환: 요청 없음 → 내 초대코드 / 요청 도착 → 요청 카드가 초대코드 카드를 대신함 / 연결 후 → 관계 카드
  const reqCard = incoming.length ? connReqCardHtml({
    name: labelFor(incomingProfile),
    rejectAttr: 'id="rejectIncoming"',
    acceptAttr: learnerLink ? '' : 'id="acceptIncoming"',
    note: learnerLink ? '이미 연결된 파트너가 있어서, 먼저 아래에서 기존 연결을 해제해야 수락할 수 있어요.' : ''
  }) : '';
  const stepCard = learnerLink ? `<div class="cx-card"><div class="cx-rel"><img class="cx-ico" src="icon_book_sprout.png" alt="">
      <div class="cx-b"><div class="cx-lab">나의 Re:Step을 받는 사람</div><div class="cx-name">${escapeHtml(labelFor(learnerProfile))}님</div></div>
      <button class="cx-btn sec" id="disconnectAsLearner">연결 해제</button></div></div>` : '';
  const cheerCard = partnerLink ? `<div class="cx-card lav"><div class="cx-rel"><img class="cx-ico" src="icon_letter.png" alt="">
      <div class="cx-b"><div class="cx-lab">나의 Re:Cheer를 받는 사람</div><div class="cx-name">${escapeHtml(labelFor(partnerProfile))}님</div></div>
      <button class="cx-btn sec" id="disconnectAsPartner">연결 해제</button></div></div>` : '';

  if(incoming.length){
    html += reqCard;
  } else if(!learnerLink){
    html += `<div class="cx-card"><div class="cx-head"><img class="cx-ico" src="icon_link.png" alt="">
      <div class="cx-b"><div class="cx-h">내 초대코드</div><div class="cx-s">이 코드를 공유하면 나와 응원 파트너로 연결할 수 있어요.</div></div></div>
      <div class="cx-code"><div class="cx-code-v">${escapeHtml(myProfile?.invite_code||'-')}</div><button class="cx-btn" id="copyInvite">복사하기</button></div></div>`;
  }

  if(mutual){
    html += `<div class="cx-mutual"><img class="cx-heart" src="heart_pair.png" alt="">
      <div class="cx-h" style="font-size:16px">${escapeHtml(labelFor(learnerProfile))}님과 서로 응원하는 사이예요</div></div>
      <div class="cx-sec">Re:Step</div>${stepCard}<div class="cx-sec">Re:Cheer</div>${cheerCard}`;
  } else {
    html += stepCard + cheerCard;
  }

  showModal(html);
  $('backToMenu').onclick = openSettingsMenu;
  if($('copyInvite')) $('copyInvite').onclick = async () => {
    const code = myProfile?.invite_code || '';
    let ok = false;
    try{ await navigator.clipboard.writeText(code); ok = true; }catch(e){
      try{ const ta=document.createElement('textarea'); ta.value=code; ta.style.cssText='position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); ok=document.execCommand('copy'); ta.remove(); }catch(e2){}
    }
    toast(ok ? '초대코드를 복사했어요.' : '복사하지 못했어요. 코드를 직접 선택해 주세요.');
  };
  // 수락/거절은 알림함과 같은 cheer_links 요청 한 건을 처리 → 어느 쪽에서 처리해도 다른 쪽엔 다시 열 때 이미 없다.
  if($('acceptIncoming')) $('acceptIncoming').onclick = async () => {
    const { error } = await client.rpc('accept_partner_connection', { p_link_id: incoming[0].id });
    if(error){ toast('❌ '+error.message); return; }
    toast('연결됐어요 💜'); updateNotifBadge(); updateLearnerConnStatus(); loadCheerSection(); loadReceivedCheers(); openConnectionSettings();
  };
  if($('rejectIncoming')) $('rejectIncoming').onclick = async () => {
    const { error } = await client.from('cheer_links').delete().eq('id', incoming[0].id);
    if(error){ toast('❌ '+error.message); return; }
    toast('요청을 거절했어요.'); updateNotifBadge(); loadCheerSection(); openConnectionSettings();
  };
  if($('disconnectAsLearner')) $('disconnectAsLearner').onclick = async () => {
    if(!confirm('나를 응원해주던 연결을 해제할까요?')) return;
    await client.from('cheer_links').update({ status: 'disconnected' }).eq('id', learnerLink.id);
    toast('연결을 해제했어요.'); updateLearnerConnStatus(); openConnectionSettings();
  };
  if($('disconnectAsPartner')) $('disconnectAsPartner').onclick = async () => {
    if(!confirm('연결을 해제할까요?')) return;
    await client.from('cheer_links').update({ status: 'disconnected' }).eq('id', partnerLink.id);
    toast('연결을 해제했어요.'); loadCheerSection(); openConnectionSettings();
  };
}

function subscribeRealtime(){
  if(realtimeChannel) return;
  realtimeChannel = client.channel('restep-changes')
    .on('postgres_changes', { event:'*', schema:'public', table:'cheer_links' }, () => { loadCheerSection(); updateNotifBadge(); updateLearnerConnStatus(); })
    .on('postgres_changes', { event:'*', schema:'public', table:'cheer_summaries' }, () => { loadCheerSection(); updateNotifBadge(); })
    .on('postgres_changes', { event:'*', schema:'public', table:'cheer_messages' }, () => { loadCheerSection(); loadReceivedCheers(); updateNotifBadge(); })
    .on('postgres_changes', { event:'*', schema:'public', table:'study_pages' }, () => loadPages())
    .on('postgres_changes', { event:'*', schema:'public', table:'study_sessions' }, (payload) => {
      const changedPageId = payload.new?.page_id || payload.old?.page_id;
      const onPageScreen = document.querySelector('.screen.active')?.id === 'pageScreen';
      if(changedPageId && changedPageId === currentPageId && onPageScreen){
        const page = pagesCache.find(p=>p.id===currentPageId);
        const deviceChanged = payload.eventType === 'UPDATE' && payload.old && payload.new && payload.old.active_device_id !== payload.new.active_device_id;
        const lostToOther = deviceChanged && payload.new.active_device_id !== deviceId;
        if(page) renderToday(page);
        if(lostToOther){
          toast('📱 다른 기기로 편집권이 넘어갔어요');
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      }
    })
    .subscribe();
}
function unsubscribeRealtime(){ if(realtimeChannel){ client.removeChannel(realtimeChannel); realtimeChannel=null; } }

// ===== 로그인 상태 =====
async function proceedToAppOrPushPrompt(){
  await probeSummaryCols(); // 자기주도 snapshot 컬럼 유무 확인(있을 때만 select에 포함)
  loadPages();
  loadReceivedCheers();
  loadCheerSection();
  updateLearnerConnStatus();
  updateNotifBadge();
  const askedKey = 'restep-push-asked-' + currentUserId;
  if(!localStorage.getItem(askedKey)){
    localStorage.setItem(askedKey, '1');
    screen('pushPromptScreen');
  } else {
    screen('homeScreen');
  }
  handleNotificationDeepLink();
}
async function render(session){
  if(session){
    currentUserId = session.user.id;
    setRole('learner');
    subscribeRealtime();
    const { data: profile } = await client.from('profiles').select('display_name').eq('id', currentUserId).single();
    if(!profile?.display_name){
      screen('nameSetupScreen');
      return;
    }
    await proceedToAppOrPushPrompt();
  } else {
    currentUserId = null;
    unsubscribeRealtime();
    screen('loginScreen');
  }
}
client.auth.onAuthStateChange((_e, session) => render(session));
client.auth.getSession().then(({data}) => render(data.session));
</script>
</body>
