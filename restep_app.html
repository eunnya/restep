      <div class="input-group"><label>학습 내용</label><input id="newTitle" placeholder="학습한 내용을 적어주세요" value="${escapeHtml(v.title)}" ${editable?'':'disabled'}></div>
      <div class="input-group" style="margin-top:9px"><label>페이지</label><div class="row" style="gap:8px"><input id="newFrom" placeholder="시작 p." value="${escapeHtml(v.from)}" ${editable?'':'disabled'}><input id="newTo" placeholder="끝 p." value="${escapeHtml(v.to)}" ${editable?'':'disabled'}></div></div>
      <div class="input-group" style="margin-top:9px"><label>메모 <span class="subtle">(선택)</span></label><textarea id="newMemo" rows="2" placeholder="개인 메모는 Re:Cheer에 공유되지 않아요." ${editable?'':'disabled'}>${escapeHtml(v.memo)}</textarea></div>
      <div class="row" style="gap:8px;margin-top:12px"><button class="btn secondary" style="flex:1" id="cancelDraftFormBtn" ${editable?'':'disabled'}>취소</button><button class="btn save" style="flex:2" id="addDraftBtn" ${editable?'':'disabled'}>${editingDraft ? '수정 저장' : '저장하기'}</button></div>
    </div>`;

  // 학습취소/마감하기는 상태와 무관하게 항상 같은 자리에 둠(DOM에서 지우지 않고 disabled만 전환).
  // 활동 0 → 학습취소 활성/마감하기 비활성, 활동 ≥1 → 반대. 마감은 탭이 아니라 STUDY 전체의 행동이라 상단에 둠.
  $('todayTab').innerHTML = accessNotice + `
    <div id="sessionContentArea" class="${editable?'':'locked-dim'}">
    <div class="card"><div style="display:flex;align-items:flex-end;justify-content:space-between;gap:10px">
      <div style="min-width:0"><span class="pill">학습 진행 중</span><span class="subtle" style="margin-left:6px;font-weight:600">· ${new Date(session.started_at).toLocaleDateString('ko-KR', {timeZone:'Asia/Seoul'})} 시작</span><h2 style="margin:9px 0 0">STUDY ${page.study_day_count+1}</h2></div>
      <div style="display:flex;gap:6px;flex-shrink:0">
        <button class="sa-btn" id="cancelStudyBtn" ${(editable&&!hasActivity)?'':'disabled'}>학습취소</button>
        <button class="sa-btn close" id="closeStudyBtn" ${(editable&&hasActivity)?'':'disabled'}>마감하기</button>
      </div>
    </div></div>
    <div id="saShell">
      <div class="sa-tabs" id="saTabs"><button data-st="review" class="${studySubTab==='review'?'active':''}">복습</button><button data-st="new" class="${studySubTab==='new'?'active':''}">새 학습</button></div>
      <div class="sa-panel" id="saPanel"><div class="rs-viewport noswipe"><div class="rs-page">${reviewPane}</div><div class="rs-page">${newPane}</div></div></div>
    </div>
    </div>`;

  // 탭 누름으로만 이동(스와이프 없음). Re:Step 상세와 같은 셸을 쓰되 사용자 스와이프는 막아둠. 화면을 다시 그리지 않고 옆으로 넘기기만 하므로
  // 입력 중인 값·체크 상태가 유지됨. 다시 그릴 때는 보던 탭 위치로 바로 복원.
  wireSdShell($('saShell'), 'saShell', i => { studySubTab = i === 1 ? 'new' : 'review'; }).jump(studySubTab === 'new' ? 1 : 0);

  document.querySelectorAll('[data-readonly]').forEach(b=>b.onclick=()=>{ localReadOnlyPages.add(b.dataset.readonly); renderSessionPanel(page, session); });
  document.querySelectorAll('[data-takeover]').forEach(b=>b.onclick=()=>{
    if(isOffline){ toast('오프라인에서는 기기 전환을 할 수 없어요.'); return; }
    const sessionId = b.dataset.takeover;
    $('deviceNoticeBox').innerHTML = `<b>이 기기에서 학습을 이어갈까요?</b><br>기존 기기에서는 읽기만 가능해집니다. 같은 세션과 복습큐는 그대로 유지됩니다.
      <div class="row" style="margin-top:9px"><button class="smallbtn" id="confirmTakeoverInline">이어가기</button><button class="smallbtn" id="cancelTakeoverInline">취소</button></div>`;
    $('confirmTakeoverInline').onclick = async () => {
      const { data, error } = await client.rpc('takeover_session_device', { p_session_id: sessionId, p_device_id: deviceId });
      if(error){ toast('❌ ' + error.message); return; }
      localReadOnlyPages.delete(page.id);
      toast('이 기기로 학습을 전환했어요.');
      renderSessionPanel(page, data);
    };
    $('cancelTakeoverInline').onclick = () => renderSessionPanel(page, session);
  });

  // "메모 보기"는 항상 동작해야 함(읽기 동작이라 세션이 잠겨있어도/오프라인이어도 무관) —
  // 그래서 아래 editable 게이트보다 앞에 둠. 상세페이지에서 학습 내용을 수정했을 수 있으니,
  // "←"로 돌아올 때 활성 세션을 서버에서 다시 읽어 복습 카드를 새로 그림. 복습 체크 상태는
  // session.queue(서버)에 저장돼 있어서 다시 그려도 그대로 유지됨. 그 뒤 스크롤 위치 복원.
  document.querySelectorAll('[data-memo-item]').forEach(el => {
    el.onclick = async (e) => {
      e.stopPropagation(); // 카드 자체의 복습 체크 토글과 안 겹치게
      const savedScrollY = window.scrollY;
      const { data: freshDay } = await client.from('study_days').select('*, study_day_items(*)').eq('id', el.dataset.memoDay).single();
      if(!freshDay) return;
      await renderStudyDayDetail(freshDay, page, async () => {
        screen('pageScreen');
        if(isOffline){
          await renderToday(page);
        } else {
          const { data: active } = await client.from('study_sessions').select('*').eq('page_id', page.id).eq('status','active');
          if(active && active.length) await renderSessionPanel(page, active[0]);
          else await renderToday(page); // 그 사이 세션이 끝났다면 시작 전 화면으로
        }
        window.scrollTo(0, savedScrollY);
      }, el.dataset.memoItem);
    };
  });

  if(!editable) return;

  document.querySelectorAll('[data-study-day]').forEach(card => {
    card.onclick = async () => {
      const completed = card.dataset.completed !== 'true';
      const { data, error } = await client.rpc('toggle_review_item', { p_session_id: session.id, p_study_day_id: card.dataset.studyDay, p_completed: completed, p_device_id: deviceId });
      if(error){ toast('❌ ' + error.message); renderToday(page); return; }
      renderSessionPanel(page, data);
    };
  });
  $('addDraftToggle').onclick = () => {
    draftFormOpen = true;
    $('addDraftToggle').style.display = 'none';
    $('draftForm').style.display = 'block';
    $('newTitle').focus();
  };
  $('cancelDraftFormBtn').onclick = () => {
    editingDraftIndex = null; draftFormOpen = false; draftFormValues = emptyDraftValues();
    renderSessionPanel(page, session, true);
  };
  $('addDraftBtn').onclick = async () => {
    const title = $('newTitle').value.trim();
    const pageFrom = $('newFrom').value.trim();
    const pageTo = $('newTo').value.trim();
    const memo = $('newMemo').value.trim();
    if(!title){ toast('학습 내용을 입력해주세요.'); return; }
    if(editingDraftIndex !== null){
      const { data, error } = await client.rpc('update_draft_item', { p_session_id: session.id, p_index: editingDraftIndex, p_title: title, p_page_from: pageFrom, p_page_to: pageTo, p_memo: memo, p_device_id: deviceId });
      if(error){ toast('❌ ' + error.message); renderToday(page); return; }
      toast('새 학습을 수정했어요.');
      editingDraftIndex = null;
    } else {
      const { data, error } = await client.rpc('add_draft_item', { p_session_id: session.id, p_title: title, p_page_from: pageFrom, p_page_to: pageTo, p_memo: memo, p_device_id: deviceId });
      if(error){ toast('❌ ' + error.message); renderToday(page); return; }
      toast('새 학습을 추가했어요.');
      var added = data;
    }
    // 저장 성공 → 폼 접고 입력값 초기화, 목록엔 즉시 반영(서버가 돌려준 최신 세션으로 다시 그림)
    draftFormOpen = false; draftFormValues = emptyDraftValues();
    const { data: fresh } = await client.from('study_sessions').select('*').eq('id', session.id).single();
    renderSessionPanel(page, fresh || added || session, true);
  };
  document.querySelectorAll('[data-edit-draft]').forEach(el => {
    el.onclick = () => {
      const i = +el.dataset.editDraft, d = session.drafts[i];
      editingDraftIndex = i;
      draftFormValues = { title: d.title||'', from: d.pageFrom||'', to: d.pageTo||'', memo: d.memo||'' };
      studySubTab = 'new';
      renderSessionPanel(page, session, true);
    };
  });
  document.querySelectorAll('[data-remove-draft]').forEach(btn => {
    btn.onclick = async () => {
      const { data, error } = await client.rpc('remove_draft_item', { p_session_id: session.id, p_index: +btn.dataset.removeDraft, p_device_id: deviceId });
      if(error){ toast('❌ ' + error.message); renderToday(page); return; }
      if(editingDraftIndex !== null){ editingDraftIndex = null; draftFormOpen = false; draftFormValues = emptyDraftValues(); } // 번호가 밀렸을 수 있어 수정 상태는 초기화
      renderSessionPanel(page, data, true);
    };
  });
  $('cancelStudyBtn').onclick = async () => {
    if(hasActivity) return;
    const { error } = await client.rpc('cancel_study_session', { p_session_id: session.id, p_device_id: deviceId });
    if(error){ toast('❌ ' + error.message); renderToday(page); return; }
    toast('학습을 취소했어요.');
    resetStudyUiState();
    renderToday(page);
  };
  // "마감하기"는 바로 마감하지 않고 별도의 마감 확인 화면으로 이동. 최종 마감은 그 화면의 버튼에서만.
  $('closeStudyBtn').onclick = () => { if(hasActivity) openCloseStudyScreen(page, session); };
}

// ===== STUDY 마감 확인 화면 =====
// 이번 STUDY 결과를 간결하게 확인하고 종료하는 화면. 실제 마감은 기존 close_study_session RPC 그대로.
function openCloseStudyScreen(page, session){
  const done = session.queue.filter(q=>q.completed).length;
  const undone = session.queue.length - done;
  const drafts = session.drafts;
  const title = drafts.length ? `STUDY ${page.study_day_count+1} 마감` : '복습 세션 마감';
  const draftList = drafts.map((d,i)=>`<div class="dr-row"><span class="dr-n">${i+1}</span><div class="dr-b"><div class="dr-t">${escapeHtml(d.title)}</div></div></div>`).join('');
  $('closeStudyBody').innerHTML = `
    <h2 style="margin:4px 0 4px">${title}</h2>
    <p class="subtle" style="margin:0 0 6px">이번 STUDY를 확인해주세요.</p>
    <div class="section-head"><h3>복습</h3></div>
    <div class="card" style="padding:12px 14px;box-shadow:none"><div class="row"><span>완료</span><b>${done}개</b></div><div class="row" style="margin-top:6px"><span class="subtle">미완료</span><span class="subtle">${undone}개</span></div></div>
    <div class="section-head"><h3>새로운 학습</h3></div>
    ${drafts.length ? `<p class="subtle" style="margin:0 0 4px">${drafts.length}개 저장</p>${draftList}` : `<p class="subtle" style="margin:0">저장한 새로운 학습이 없어요.</p>`}
    <p style="margin:26px 2px 4px;font-size:13px;font-weight:700;color:var(--ink)">마감 후에도 기록에서 새로 학습한 내용은 수정할 수 있어요.</p>
    <p class="subtle" style="margin:0 2px 14px;font-size:11.5px">복습 체크는 마감 후에는 바꿀 수 없어요.</p>
    <button class="btn primary full" id="finalCloseBtn">STUDY 마감하기</button>`;
  screen('closeStudyScreen');
  $('finalCloseBtn').onclick = async () => {
    $('finalCloseBtn').disabled = true;
    const { error } = await client.rpc('close_study_session', { p_session_id: session.id, p_device_id: deviceId });
    if(error){ toast('❌ ' + error.message); screen('pageScreen'); renderToday(page); return; }
    toast('짝꿍에게 Re:Step을 보냈어요 🌱');
    resetStudyUiState();
    loadPages();
    const { data: freshPage } = await client.from('study_pages').select('*').eq('id', page.id).single();
    screen('pageScreen');
    document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active', x.dataset.tab==='today'));
    $('todayTab').style.display='block'; $('recordsTab').style.display='none'; $('statusTab').style.display='none';
    if(freshPage){ renderToday(freshPage); }
  };
}

// ===== 기록 탭 =====
let recordsTabScrollY = 0; // 상세페이지 갔다가 돌아올 때 기록 목록 스크롤 위치 복원용
async function renderRecords(page){
  const { data: days } = await client.from('study_days').select('*, study_day_items(*)').eq('page_id', page.id).order('day_number', {ascending:false});
  // study_days는 close_study_session에서 drafts가 있을 때만 만들어지므로, 복습만 하고 마감한
  // 세션은 애초에 여기 안 들어옴 — 별도 필터링 불필요.
  const { data: sessions } = await client.from('study_sessions').select('id, step_number, started_at, closed_at').eq('page_id', page.id).eq('status','closed');
  const sessionByStep = {};
  (sessions||[]).forEach(s => { sessionByStep[s.step_number] = s; });
  // 복습 개수는 상세페이지와 같은 기준(이 세션에서 완료된 서로 다른 STUDY 수)으로 계산 → 목록과 상세 수치가 어긋나지 않음.
  const sessionIds = (sessions||[]).map(x=>x.id);
  const reviewDaysBySession = {};
  if(sessionIds.length){
    const { data: cps } = await client.from('review_checkpoints').select('study_day_id, completed_session_id').in('completed_session_id', sessionIds);
    (cps||[]).forEach(c => { (reviewDaysBySession[c.completed_session_id] = reviewDaysBySession[c.completed_session_id] || new Set()).add(c.study_day_id); });
  }

  // 목록은 "한 STUDY 세션에서 무엇을 했는지" 요약만: STUDY 번호 · 기간 · 복습 수 · 새 학습 수 (개별 학습내용 힌트 없음).
  $('recordsTab').innerHTML = (days && days.length) ? days.map(d=>{
    const session = sessionByStep[d.created_step] || null;
    const dateLabel = formatStudyDateRange(session, d);
    const reviewCount = session && reviewDaysBySession[session.id] ? reviewDaysBySession[session.id].size : 0;
    const newCount = (d.study_day_items||[]).length;
    return `<div class="record" data-open-study="${d.id}">
      <div class="row" style="align-items:flex-start"><div style="font-size:17px;font-weight:850;color:var(--ink)">STUDY ${d.day_number}</div><span class="rec-x" data-del-study="${d.id}" title="STUDY 삭제" aria-label="STUDY 삭제">×</span></div>
      <div class="subtle" style="margin-top:4px;font-size:11.5px;font-weight:500">${escapeHtml(dateLabel)}</div>
      <div class="row" style="margin-top:8px;gap:10px">
        <div class="subtle" style="font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">복습 ${reviewCount}개 완료 · 새로운 학습 ${newCount}개</div>
        <span style="font-size:12.5px;font-weight:700;color:var(--green-d);flex-shrink:0">보기 →</span>
      </div>
    </div>`;
  }).join('') : '<div class="card"><p class="subtle" style="margin:0">아직 STUDY 기록이 없어요.</p></div>';

  // × = STUDY 전체 삭제(바로 지우지 않고 기존 삭제 확인을 거침). 카드 전체 클릭(상세 열기)과 안 겹치게 전파 차단.
  document.querySelectorAll('[data-del-study]').forEach(x => {
    x.onclick = e => {
      e.stopPropagation();
      const day = days.find(d=>d.id===x.dataset.delStudy);
      if(day) confirmDeleteDay(day, page);
    };
  });
  document.querySelectorAll('[data-open-study]').forEach(el => {
    el.onclick = () => {
      recordsTabScrollY = window.scrollY;
      openStudyDayDetailFromRecords(el.dataset.openStudy, page);
    };
  });
}
// 기록 목록 카드에서 상세페이지로 진입. STUDY 번호가 아니라 실제 study_day_id(PK)로 여는 게
// 핵심 — 번호는 삭제 후 재정렬될 수 있어서 영구 식별자가 아님.
async function openStudyDayDetailFromRecords(studyDayId, page){
  const { data: day, error } = await client.from('study_days').select('*, study_day_items(*)').eq('id', studyDayId).single();
  if(error || !day){ toast('❌ 해당 STUDY를 찾을 수 없어요.'); return; }
  await renderStudyDayDetail(day, page, async () => {
    // "←"를 누르면 기록 탭의 원래 스크롤 위치까지 복원 — 목록 맨 위가 아니라 보던 자리로.
    screen('pageScreen');
    document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active', x.dataset.tab==='records'));
    $('todayTab').style.display = 'none';
    $('recordsTab').style.display = 'block';
    $('statusTab').style.display = 'none';
    await renderRecords(page);
    window.scrollTo(0, recordsTabScrollY);
  });
}
function editDayModal(day, page, onSaved){
  const items = day.study_day_items || [];
  const snapshot = items.map(it => ({ title: it.title||'', page_from: it.page_from||'', page_to: it.page_to||'', memo: it.memo||'' }));

  function isDirty(){
    return items.some((it,i) => {
      const titleEl = document.querySelector(`[data-ei="${i}"][data-ek="title"]`);
      if(!titleEl) return false;
      const fromEl = document.querySelector(`[data-ei="${i}"][data-ek="page_from"]`);
      const toEl = document.querySelector(`[data-ei="${i}"][data-ek="page_to"]`);
      const memoEl = document.querySelector(`[data-ei="${i}"][data-ek="memo"]`);
      return titleEl.value.trim() !== snapshot[i].title
        || fromEl.value.trim() !== snapshot[i].page_from
        || toEl.value.trim() !== snapshot[i].page_to
        || memoEl.value.trim() !== snapshot[i].memo;
    });
  }

  showModal(`
   <div id="editDayForm">
     <h3>STUDY ${day.day_number} 수정</h3>
     <p class="subtle">수정한 내용은 앞으로의 복습에도 반영돼요.</p>
     <div id="editDayItems">${items.map((it,i)=>`<div class="card">
       <label>학습 내용</label><input data-ei="${i}" data-ek="title" value="${escapeHtml(it.title)}">
       <div class="row" style="margin-top:8px"><input data-ei="${i}" data-ek="page_from" placeholder="시작 p." value="${escapeHtml(it.page_from||'')}"><input data-ei="${i}" data-ek="page_to" placeholder="끝 p." value="${escapeHtml(it.page_to||'')}"></div>
       <label style="margin-top:8px">메모</label><textarea rows="2" data-ei="${i}" data-ek="memo">${escapeHtml(it.memo||'')}</textarea>
     </div>`).join('')}</div>
     <div style="position:sticky;bottom:-30px;margin:16px -18px -30px;padding:12px 18px 30px;background:#fff;border-top:1px solid var(--line)">
       <button class="btn primary full" id="saveEditedDay">변경사항 저장</button>
     </div>
   </div>
   <div id="leaveConfirmOverlay" style="display:none">
     <h3>수정한 내용을 저장하지 않고 나갈까요?</h3>
     <p class="subtle">저장하지 않은 변경사항은 사라져요.</p>
     <div class="row" style="gap:8px;margin-top:14px">
       <button class="btn secondary" style="flex:1" id="keepEditingBtn">계속 수정하기</button>
       <button class="btn danger" style="flex:1" id="leaveWithoutSaveBtn">나가기</button>
     </div>
   </div>`);

  // 배경 클릭으로 나가려고 할 때, 실제 값이 바뀐 경우에만 확인 절차를 가로챔.
  // 폼 DOM은 그대로 두고 보이기/숨기기만 하므로 타이핑하던 내용은 안 사라짐.
  modalDirtyGuard = () => {
    if(isDirty()){
      $('editDayForm').style.display = 'none';
      $('leaveConfirmOverlay').style.display = 'block';
    } else {
      modalDirtyGuard = null; closeModal();
    }
  };
  $('keepEditingBtn').onclick = () => { $('leaveConfirmOverlay').style.display = 'none'; $('editDayForm').style.display = 'block'; };
  $('leaveWithoutSaveBtn').onclick = () => { modalDirtyGuard = null; closeModal(); };

  $('saveEditedDay').onclick = async () => {
    const grouped = {};
    document.querySelectorAll('#editDayItems [data-ei]').forEach(inp=>{
      const idx = +inp.dataset.ei; grouped[idx] = grouped[idx] || {}; grouped[idx][inp.dataset.ek] = inp.value.trim();
    });
    for(const idx in grouped){
      const it = items[idx]; if(!it) continue;
      await client.from('study_day_items').update(grouped[idx]).eq('id', it.id);
    }
    modalDirtyGuard = null;
    closeModal(); toast('학습기록을 수정했어요.');
    if(onSaved) await onSaved(); else renderRecords(page);
  };
}
async function confirmDeleteDay(day, page, onDeleted){
  const finish = onDeleted || (async () => {
    const { data: freshPage } = await client.from('study_pages').select('*').eq('id', page.id).single();
    if(freshPage) renderRecords(freshPage);
  });
  const { data: activeSessions } = await client.from('study_sessions').select('*').eq('page_id', page.id).eq('status','active');
  if(activeSessions.length && activeSessions[0].queue.some(q=>q.studyDayId===day.id)){
    showModal(`<h3>지금은 이 기록을 삭제할 수 없어요</h3>
    <p class="subtle">STUDY ${day.day_number}는 현재 진행 중인 학습 세션의 복습 큐에 포함되어 있어요. 세션을 STUDY 마감하거나 학습취소한 뒤에 다시 삭제해주세요.</p>
    <button class="btn secondary full" id="closeBlockedDelete">확인</button>`);
    $('closeBlockedDelete').onclick = () => {
      closeModal();
      document.querySelector('.tabs button[data-tab="today"]').click();
    };
    return;
  }
  // "뒤에 이미 만들어진 STUDY"가 있으면 그 Re:Step들 번호 표시가 헷갈릴 수 있음(6번-11 참고).
  // study_days 행은 close_study_session에서 cheer_summaries와 항상 같이 만들어지므로,
  // "뒤에 STUDY가 존재한다" = "그 Re:Step도 이미 만들어져 있다"라 이 카운트만으로 충분함.
  const { count: laterCount } = await client.from('study_days').select('id', { count: 'exact', head: true }).eq('page_id', page.id).gt('day_number', day.day_number);
  const reorderNotice = laterCount > 0
    ? '<p class="subtle">이미 만들어졌던 Re:Step들의 STUDY 번호는 기존 번호로 유지됩니다.</p>'
    : '';
  showModal(`<h3>이 STUDY를 삭제할까요?</h3>
  <div class="notice danger"><b>저장한 학습 내용과 앞으로 예정된 복습도 함께 사라져요.</b></div>
  <p class="subtle">삭제 후 뒤의 STUDY 번호는 자동으로 다시 정리됩니다.</p>
  ${reorderNotice}
  <div class="row" style="gap:8px"><button class="btn secondary" style="flex:1" id="cancelDeleteDay">취소</button><button class="btn danger" style="flex:1" id="yesDeleteDay">삭제</button></div>`);
  $('yesDeleteDay').onclick = async () => {
    await client.from('study_days').delete().eq('id', day.id);
    const { data: remaining } = await client.from('study_days').select('*').eq('page_id', page.id).order('day_number');
    for(let i=0;i<(remaining||[]).length;i++){
      if(remaining[i].day_number !== i+1) await client.from('study_days').update({ day_number:i+1 }).eq('id', remaining[i].id);
    }
    await client.from('study_pages').update({ study_day_count:(remaining||[]).length }).eq('id', page.id);
    closeModal(); toast('학습기록을 삭제했어요.');
    loadPages();
    await finish();
  };
  $('cancelDeleteDay').onclick = closeModal;
}

// ===== STUDY 상세페이지 =====
// "확정된 학습 기록을 읽는 화면" — REVIEW STEP 진행상태·Re:Cheer 정보는 여기 안 넣음(4단계 요구사항).
let studyDetailBackHandler = null;

function formatKSTDate(ts){
  return new Date(ts).toLocaleDateString('ko-KR', { timeZone: 'Asia/Seoul' });
}
// STUDY를 만든 세션을 찾는 방법: study_days.created_step이 그 세션의 step_number를 그대로
// 저장해둔 값이라(close_study_session 참고), page_id+step_number로 역추적함.
// step_number는 페이지마다 세션이 마감될 때만 1씩 증가(취소된 세션은 증가 안 함)하므로 유일함.
async function findSessionForDay(day){
  const { data } = await client.from('study_sessions').select('id, step_number, started_at, closed_at')
    .eq('page_id', day.page_id).eq('step_number', day.created_step).eq('status','closed').maybeSingle();
  return data || null;
}
function formatStudyDateRange(session, day){
  if(!session) return formatKSTDate(day.created_at); // 세션을 못 찾은 경우의 최소한의 대안
  const startStr = formatKSTDate(session.started_at);
  const endStr = formatKSTDate(session.closed_at || day.created_at);
  if(startStr === endStr) return startStr;
  const endShort = endStr.replace(/^\d+\.\s*/, ''); // 연도 부분 생략, "9. 7."만 남김
  return `${startStr} ~ ${endShort}`;
}

// dayId 하나로 필요한 데이터(요약 + 페이지)를 전부 불러와서 렌더링까지 한 번에 처리.
// backHandler: "←"를 눌렀을 때 할 일. 안 주면 기본으로 홈으로 감(12번 요구사항 — 호출부가
// 알아서 "기록 탭으로" 등 원하는 동작을 넘겨주는 구조라 여기서 특정 화면을 강제하지 않음).
async function renderStudyDayDetail(day, page, backHandler, targetItemId, startTab, scrollToCheer){
  studyDetailBackHandler = backHandler || (() => { screen('homeScreen'); loadPages(); });
  const session = await findSessionForDay(day);
  const dateLabel = formatStudyDateRange(session, day);
  const items = (day.study_day_items || []).slice().sort((a,b)=>(a.position||0)-(b.position||0));

  // 공통 shell(sdDetailHtml)에 sage tone + "원본 기록" 깊이의 정보를 넣는다.
  // 복습 탭: 이 세션에서 끝낸 (과거 STUDY, REVIEW STEP). 세션이 마감될 때 review_checkpoints.completed_session_id에
  // 세션 id가 남으므로 UUID로 정확히 역추적. 과거 STUDY의 내용·페이지·메모·예정일은 안 펼침.
  const reviewRows = [];
  if(session){
    const { data: cps } = await client.from('review_checkpoints').select('study_day_id, stage_index, due_step').eq('completed_session_id', session.id);
    const byDay = {};
    (cps||[]).forEach(c => { (byDay[c.study_day_id] = byDay[c.study_day_id] || []).push(c); });
    const ids = Object.keys(byDay);
    if(ids.length){
      const { data: dayRows } = await client.from('study_days').select('id, day_number').in('id', ids);
      const numById = Object.fromEntries((dayRows||[]).map(d=>[d.id, d.day_number]));
      ids.filter(id=>numById[id] !== undefined).map(id => {
        const stages = byDay[id].map(c=>c.stage_index).sort((x,y)=>x-y);
        const names = stages.map(i=>STAGE_NAMES[i]);
        return { n: numById[id], label: names.length>1 ? names.join(' + ')+' 통합' : names[0], deepest: Math.max(...stages),
                 late: !byDay[id].some(c=>c.due_step === session.step_number) }; // 복습 큐의 regular 판정과 같은 기준
      }).sort((x,y)=>y.n-x.n).forEach((r,i)=>{
        reviewRows.push(sdRow(i+1, `<div class="rs-bt"><span class="rs-t">STUDY ${r.n}</span><span class="pill" style="background:${STAGE_COLORS[r.deepest]};color:#3d7a48">${escapeHtml(r.label)}</span>${r.late?'<span class="pill gray">밀린 복습</span>':''}</div>`));
      });
    }
  }
  const metaLine = (k, v) => `<div class="rs-meta"><span class="k">${k}</span><span class="v">${escapeHtml(v)}</span></div>`;
  const itemRows = items.map((it, i) => {
    const range = formatPageRange(it.page_from, it.page_to);
    // 항목 1개만 대상으로 하는 수정/삭제(STUDY 전체 삭제는 기록 목록의 ×에서만).
    return sdRow(i+1, `<div style="display:flex;align-items:flex-start;gap:10px"><div class="rs-t" style="flex:1;min-width:0">${escapeHtml(it.title)}</div><div class="dr-a"><span class="dr-edit" data-item-edit="${it.id}">수정</span><span class="dr-del" data-item-del="${it.id}">삭제</span></div></div>${range?metaLine('페이지', range):''}${it.memo?metaLine('메모', it.memo):''}`, `data-study-item="${it.id}"`);
  });

  // 하단 "받은 Re:Cheer": 이 세션에서 발송된 Re:Step에 도착한 응원(읽기 전용, 탭 아님). 표시 여부는 기존 관계 가시성
  // 정책(learnerItemState) 그대로. 발송된 Re:Step 자체가 없으면 영역을 안 그림.
  let cheerHtml = '';
  if(session){
    const link = await getMyConnectedLink();
    const { data: sm } = await client.from('cheer_summaries').select('*, cheer_messages(*)').eq('session_id', session.id).maybeSingle();
    if(sm){
      const st = learnerItemState(sm, link);
      const head = `<div class="section-head" style="margin-top:26px;margin-bottom:8px"><h3 style="margin:0;font-size:14px">받은 Re:Cheer</h3></div>`;
      if(st.type === 'visible') cheerHtml = sdCheerNote('받은 Re:Cheer', st.msg.message, sdWhen(st.msg.created_at));
      else if(st.type === 'locked') cheerHtml = `${head}<p class="subtle" style="margin:0 2px">이전 연결에서 받은 Re:Cheer예요.</p>`;
      else cheerHtml = `${head}<p class="subtle" style="margin:0 2px">아직 받은 응원이 없어요.</p>`;
    }
  }

  $('studyDetailBody').innerHTML = sdDetailHtml({
    tone: 'sage', title: `${escapeHtml(page.name)} · STUDY ${day.day_number}`, dateLabel,
    reviewCount: reviewRows.length, newCount: itemRows.length,
    reviewPage: sdPage(`복습한 STUDY ${reviewRows.length}개`, reviewRows, '이번 STUDY에서 완료한 복습이 없어요.'),
    newPage: sdPage(`새로운 학습 ${itemRows.length}개`, itemRows, '이 STUDY에 기록된 새 학습 항목이 없어요.')
  }) + `<div id="sdCheer">${cheerHtml}</div><div style="height:8px"></div>`;
  const ctl = wireSdShell($('studyDetailBody').querySelector('.sd'), 'studyDetail');

  screen('studyDetailScreen');
  enterDetailNav(studyDetailBackHandler);
  if(startTab === 1 && !targetItemId) ctl.goTo(1);
  if(scrollToCheer && cheerHtml) setTimeout(() => { const c = $('sdCheer'); if(c) window.scrollTo({ top: c.getBoundingClientRect().top + window.scrollY - window.innerHeight/2, behavior:'smooth' }); }, 200);

  if(targetItemId){
    ctl.goTo(1); // 메모 보기 등으로 특정 항목을 열 땐 새 학습 탭으로
    setTimeout(() => {
      const el = document.querySelector(`#studyDetailBody [data-study-item="${targetItemId}"]`);
      if(!el) return;
      const more = el.closest('.rs-more');
      if(more && more.style.display === 'none'){ const f = more.parentElement.nextElementSibling; if(f && f.classList.contains('rs-fold')) f.click(); }
      setTimeout(() => window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - window.innerHeight/2, behavior:'smooth' }), 80);
    }, 500);
  }

  const refresh = async () => {
    const { data: freshDay } = await client.from('study_days').select('*, study_day_items(*)').eq('id', day.id).single();
    if(freshDay) await renderStudyDayDetail(freshDay, page, backHandler, null, 1);
    renderToday(page); // 진행 중인 세션이 있으면 학습 탭의 복습 카드에도 바로 반영(없으면 시작 전 화면)
  };
  // 수정: 기존 STUDY 수정 UI를 그대로 쓰되 이 항목 1개만 넘김.
  document.querySelectorAll('#studyDetailBody [data-item-edit]').forEach(el => {
    el.onclick = () => {
      const it = items.find(x=>x.id===el.dataset.itemEdit);
      if(it) editDayModal({ ...day, study_day_items: [it] }, page, refresh);
    };
  });
  // 삭제: 이 항목 1개만. 복습 대상 STUDY 자체는 그대로고 내용만 갱신되므로, 진행 중인 세션의 복습 큐에 있어도 허용한다
  // (STUDY 전체 삭제는 큐의 대상 자체가 사라져서 막음). 막는 건 마지막 남은 항목뿐. 5/5 완료 STUDY는 확인 문구만 다르다.
  document.querySelectorAll('#studyDetailBody [data-item-del]').forEach(el => {
    el.onclick = async () => {
      const it = items.find(x=>x.id===el.dataset.itemDel);
      if(!it) return;
      const blockedModal = (title, body) => {
        showModal(`<h3>${title}</h3><p class="subtle">${body}</p><button class="btn secondary full" id="itemDelOk">확인</button>`);
        $('itemDelOk').onclick = closeModal;
      };
      // 빈 STUDY는 만들지 않음
      if(items.length <= 1){
        blockedModal('마지막 학습 항목은 삭제할 수 없어요', '이 항목을 지우면 STUDY에 새 학습 내용이 남지 않아요. STUDY 전체를 삭제하려면 기록 목록의 ×를 이용해주세요.');
        return;
      }
      // 일반 삭제 확인 — 복습이 모두 끝난 STUDY(5/5)엔 "복습" 언급을 빼고 문구만 다르게
      const { data: cps } = await client.from('review_checkpoints').select('status').eq('study_day_id', day.id);
      const allDone = (cps||[]).filter(c=>c.status==='done').length === 5;
      const body = allDone
        ? '삭제한 내용은 이후 기록에서 보이지 않아요.'
        : '삭제한 내용은 이후 기록과 복습에서 보이지 않아요.';
      showModal(`<h3>이 학습 항목을 삭제할까요?</h3><p class="subtle">${body}</p>
        <div class="row" style="gap:8px;margin-top:14px"><button class="btn secondary" style="flex:1" id="itemDelCancel">취소</button><button class="btn danger" style="flex:1" id="itemDelYes">삭제</button></div>`);
      $('itemDelCancel').onclick = closeModal;
      $('itemDelYes').onclick = async () => {
        const { data: gone, error } = await client.from('study_day_items').delete().eq('id', it.id).select('id');
        if(error || !gone || !gone.length){ closeModal(); toast('❌ 삭제하지 못했어요' + (error ? ': ' + error.message : ' (권한 설정을 확인해주세요)')); return; }
        closeModal(); toast('학습 항목을 삭제했어요.');
        await refresh();
      };
    };
  });
}
$('closeStudyBackBtn').onclick = () => screen('pageScreen');
$('studyDetailBackBtn').onclick = () => goBackFromDetail(studyDetailBackHandler);

// 콘솔 전용 개발 진입점(다음 단계에서 "기록" 탭 카드 → 여기, "메모 보기" → 여기 두 곳에서
// 재사용할 예정). study_days의 실제 PK(study_day_id)로 열도록 함 — day_number는 페이지마다
// 겹칠 수 있고 삭제로 재정렬될 수도 있어서 영구 식별자로 부적합하기 때문. 사용자 UI엔 버튼 없음.
// 예: openStudyDayDetail('abcd-...-uuid') 또는 openStudyDayDetail('abcd-...-uuid', { targetItemId: '...' })
window.openStudyDayDetail = async function(studyDayId, opts){
  const targetItemId = (opts && opts.targetItemId) || null;
  const { data: day, error } = await client.from('study_days').select('*, study_day_items(*)').eq('id', studyDayId).single();
  if(error || !day){ console.warn('openStudyDayDetail: 해당 STUDY를 찾을 수 없어요.'); return; }
  const { data: page, error: pageError } = await client.from('study_pages').select('*').eq('id', day.page_id).single();
  if(pageError || !page){ console.warn('openStudyDayDetail: 페이지를 찾을 수 없어요.'); return; }
  await renderStudyDayDetail(day, page, null, targetItemId);
};

// ===== 현황 탭 =====
async function renderStatus(page, opts){
  const { data: days } = await client.from('study_days').select('*, study_day_items(*)').eq('page_id', page.id).order('day_number', {ascending:false});
  const dayIds = (days||[]).map(d=>d.id);
  const { data: checkpoints } = dayIds.length
    ? await client.from('review_checkpoints').select('*').in('study_day_id', dayIds)
    : { data: [] };
  const byDay = {};
  (checkpoints||[]).forEach(c => { (byDay[c.study_day_id] = byDay[c.study_day_id] || []).push(c); });
  const isComplete = d => (byDay[d.id]||[]).filter(c=>c.status==='done').length===5;
  const total = (days||[]).length;
  const doneDays = (days||[]).filter(isComplete);   // 둘 다 days가 STUDY 번호 내림차순이라
  const ongoingDays = (days||[]).filter(d=>!isComplete(d)); // 필터해도 내림차순이 그대로 유지됨
  const complete = doneDays.length;

  // 학습내용 요약: 1개=그대로, 2개="A / B", 3개 이상="A / B 외 N개". 카드 높이가 학습내용 수에
  // 따라 늘어나지 않게 한 줄 ellipsis. 실제 내용 전체는 학습 탭의 "복습할 내용"에서 봄.
  const summarize = d => {
    const t = (d.study_day_items||[]).slice().sort((a,b)=>(a.position||0)-(b.position||0)).map(i=>escapeHtml(i.title));
    if(t.length <= 2) return t.join(' / ');
    return `${t[0]} / ${t[1]} 외 ${t.length-2}개`;
  };
  const cardHtml = d => {
    const cps = (byDay[d.id]||[]).sort((a,b)=>a.stage_index-b.stage_index);
    const done = cps.filter(c=>c.status==='done').length;
    const next = cps.find(c=>c.status!=='done');
    return `<div class="card status-card" data-open-study="${d.id}"><div class="row" style="gap:10px"><div style="min-width:0;flex:1"><b>STUDY ${d.day_number}</b><div class="subtle" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${summarize(d)}</div></div><b style="flex-shrink:0">${done} / 5</b></div>
      <div class="stage-row">${cps.map(c=>`<span class="stage ${c.status==='done'?'done':''}"${c.status==='done'?` style="background:${STAGE_COLORS[c.stage_index]}"`:''}>${c.status==='done'?'✓ ':''}${STAGE_NAMES[c.stage_index]}</span>`).join('')}</div>
      <div class="subtle" style="margin-top:10px">다음: ${next?STAGE_NAMES[next.stage_index]:'모든 복습 완료'}</div></div>`;
  };

  const statsHtml = `<div class="stats">
    <div class="stat"><span class="subtle">총 STUDY 수</span><strong>${total}</strong></div>
    <div class="stat"><span class="subtle">복습완료 STUDY</span><strong>${complete}</strong></div>
    <div class="stat"><span class="subtle">복습 남은 STUDY</span><strong>${total-complete}</strong></div></div>`;

  if(!total){
    $('statusTab').innerHTML = statsHtml + '<div class="card"><p class="subtle" style="margin:0">아직 학습 현황이 없어요.</p></div>';
    return;
  }

  const ongoingHtml = ongoingDays.length
    ? ongoingDays.map(cardHtml).join('')
    : '<p class="subtle" style="margin:6px 2px 14px">현재 복습 중인 STUDY가 없어요.</p>';
  // 완료 STUDY는 지우지 않고 보존하되 기본은 접힘. 접힌 아카이브 헤더 느낌(얇은 border, 배경 없음).
  const doneHtml = complete ? `
    <div id="statusDoneToggle" role="button" aria-expanded="false" style="display:flex;align-items:center;justify-content:space-between;margin-top:18px;padding:11px 14px;border:1px solid var(--line);border-radius:14px;cursor:pointer">
      <span style="font-size:13px;font-weight:700;color:var(--ink)">복습 완료된 STUDY <span style="font-weight:500;color:var(--muted)">${complete}개</span></span>
      <span id="statusDoneChevron" style="font-size:13px;color:var(--muted)">⌄</span>
    </div>
    <div id="statusDoneList" style="display:none;margin-top:10px">${doneDays.map(cardHtml).join('')}</div>` : '';

  $('statusTab').innerHTML = statsHtml +
    '<div class="section-head"><h3>복습 중인 STUDY</h3></div>' + ongoingHtml + doneHtml;

  const setDoneOpen = open => {
    $('statusDoneList').style.display = open ? 'block' : 'none';
    $('statusDoneChevron').textContent = open ? '⌃' : '⌄';
    $('statusDoneToggle').setAttribute('aria-expanded', open ? 'true' : 'false');
  };
  if(complete){
    $('statusDoneToggle').onclick = () => setDoneOpen($('statusDoneList').style.display === 'none');
    if(opts && opts.expandDone) setDoneOpen(true); // 상세페이지에서 돌아올 때 펼침 상태 복원
  }
  // 카드 전체가 STUDY 상세 진입점(진행 중/완료 동일). 번호가 아니라 실제 study_day_id로 연다.
  document.querySelectorAll('#statusTab [data-open-study]').forEach(el => {
    el.onclick = () => {

// 복습현황 → STUDY 상세. "←"로 돌아오면 같은 페이지의 복습현황 탭을 다시 그리고(수정/삭제 반영),
// 완료 영역 펼침 상태와 스크롤 위치를 복원한다.
async function openStudyDayDetailFromStatus(studyDayId, page, scrollY, expandDone){
  const { data: day, error } = await client.from('study_days').select('*, study_day_items(*)').eq('id', studyDayId).single();
  if(error || !day){ toast('❌ 해당 STUDY를 찾을 수 없어요.'); return; }
  await renderStudyDayDetail(day, page, async () => {
    screen('pageScreen');
    document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active', x.dataset.tab==='status'));
    $('todayTab').style.display = 'none';
    $('recordsTab').style.display = 'none';
    $('statusTab').style.display = 'block';
    await renderStatus(page, { expandDone });
    window.scrollTo(0, scrollY);
  });
}

// ===== Re:Step 현황 (학습자) =====
async function getMyConnectedLink(){
  const { data: links } = await client.from('cheer_links').select('*').eq('learner_user_id', currentUserId).eq('status','connected');
  return (links && links.length) ? links[0] : null;
}

// 파트너 RLS 정책이 "연결 시점(first_connected_at) 이후 생성된 Re:Step만" 노출하도록 되어있어서
// (의도된 설계: 연결 전엔 받아줄 상대가 없고, 밀린 과거분까지 한꺼번에 응원 대상이 되면 부담이 큼),
// 연결 전에 만들어진 Re:Step은 영원히 응원을 받을 수 없음 → 학습자 화면에서도 아예 목록에서 제외.
// cheer_messages.summary_id에 UNIQUE 제약이 있어서 PostgREST가 1:1 관계로 판단해
// 배열이 아니라 단일 객체(또는 null)로 내려줌. 배열/객체/null 어떤 형태로 와도 안전하게 처리.
// ===== Re:Step 요약(발송본) 공통 헬퍼: 전공/교과(STUDY)와 자기주도(STEP)는 같은 Re:Step이고 제목·아이콘·서브문구만 다르다 =====
let SUMX = ''; // 3단계 SQL(자기주도 snapshot 컬럼)이 적용돼 있을 때만 select에 붙임 — 안 돼 있어도 전공/교과 화면은 그대로 동작
async function probeSummaryCols(){
  const { error } = await client.from('cheer_summaries').select('kind, step_number_snapshot, activity_name_snapshot, amount_snapshot').limit(1);
  SUMX = error ? '' : ', kind, step_number_snapshot, activity_name_snapshot, amount_snapshot';
}
function sumLabel(s){
  s = s || {};
  const pg = escapeHtml(s.page_name_snapshot || '학습');
  if(s.kind === 'self') return `${pg} · STEP ${s.step_number_snapshot}`;
  return s.study_day_number_snapshot ? `${pg} · STUDY ${s.study_day_number_snapshot}` : `${pg} · 복습 세션`;
}
const sumIcon = s => `<img class="cl-ico" src="${s && s.kind === 'self' ? 'icon_sprout.png' : 'icon_book.png'}" alt="">`;
const sumChip = ts => { // 날짜칩 2줄(11월 / 18일)
  const dt = new Date(ts);
  return `<div class="cl-chip"><span class="m">${dt.toLocaleDateString('ko-KR', { timeZone:'Asia/Seoul', month:'long' })}</span><span class="d">${dt.toLocaleDateString('ko-KR', { timeZone:'Asia/Seoul', day:'numeric' })}</span></div>`;
};
function sdSelfDetailHtml(s, title){ // 자기주도 Re:Step 상세: 복습 탭 없이 요약 카드 + 활동 상세
  const kv = (k, v) => `<div class="kv"><div class="k">${k}</div><div class="v">${escapeHtml(v)}</div></div>`;
  const rows = kv('활동명', s.activity_name_snapshot || '')
    + (s.amount_snapshot ? kv('시간·횟수', s.amount_snapshot) : '')
    + kv('인증', verifiedLabel(s.verified_snapshot))
    + (s.memo_snapshot ? kv('메모', s.memo_snapshot) : '');
  return `<div class="sd lav">
    <div class="sd-sum"><h2>${title}</h2><div class="sd-date" style="margin-bottom:0">${escapeHtml(formatKSTDate(s.created_at))}</div></div>
    <div class="section-head" style="margin:20px 0 8px"><h3 style="margin:0;font-size:14px">활동 상세</h3></div>
    <div class="sd-act">${rows}</div>
  </div>`;
}
function oneMsg(cm){
  if(!cm) return null;
  return Array.isArray(cm) ? (cm[0] || null) : cm;
}

function isCheerable(summary, link){
  const msg = oneMsg(summary.cheer_messages);
  if(msg) return true;
  // 연결된 파트너가 없을 땐 "연결 전/후"를 판단할 기준이 없으니, 숨기지 않고
  // 일단 대기 중으로 보여준다. (재연결되면 그때 첫 연결 시점 기준으로 재평가됨)
  if(!link) return true;
  return new Date(summary.created_at) >= new Date(link.first_connected_at);
}

// 연결 해제 시 "상대가 만든 콘텐츠"를 숨기기 위한 헬퍼. isCheerable()과 역할을 분리함:
//   isCheerable(summary, link)      → 지금 관계에서 이 Re:Step이 "응원 대상"인지 판단
//   getVisibleCheerMessage(...)     → 이미 있는 Re:Cheer를 "지금 보여줘도 되는지" 판단
// oneMsg()는 순수 데이터 정규화만 담당하고 연결 상태는 전혀 모른다 — 책임을 섞지 않기 위함.
// 메시지가 실제로 존재해도, 그걸 보낸 사람이 "지금 연결되어 있는 상대"와 다르면 숨긴다.
// (같은 상대와 재연결되면 link.partner_user_id가 다시 그 사람으로 돌아오므로, 메시지의
//  partner_user_id와 다시 일치하게 되어 별도 처리 없이 자동으로 복원됨)
function getVisibleCheerMessage(summary, link){
  const msg = oneMsg(summary.cheer_messages);
  if(!msg || !link) return null;
  return msg.partner_user_id === link.partner_user_id ? msg : null;
}

async function updateLearnerConnStatus(){
  const el = $('learnerConnStatus');
  if(!el) return;
  const link = await getMyConnectedLink();
  el.style.cursor = 'pointer';
  el.onclick = () => openConnectionSettings();

    el.innerHTML = `<span class="conn-meta">${escapeHtml(labelFor(profile))}님과 연결됨</span>`; // 정상 연결은 조용하게(metadata)
  } else {
    el.innerHTML = `<span class="mini-status warn">아직 연결된 응원 파트너가 없어요 · 연결하기 →</span>`;
  }
}

async function loadReceivedCheers(){
  const listEl = $('receivedCheerList');
  if(!listEl) return; // 홈에서 Re:Step 현황 영역을 뺐음(데이터/함수는 유지)
  const link = await getMyConnectedLink();
  const { data: raw, error } = await client
    .from('cheer_summaries')
    .select('*, cheer_messages(*)')
    .eq('learner_user_id', currentUserId)
    .order('created_at', { ascending: false })
    .limit(30);
  if(error){ listEl.textContent = '❌ ' + error.message; return; }
  // 응원 가능성 정책은 그대로 적용한 뒤 최신순 최대 3건. (정책으로 걸러지는 게 있어도 3건이 채워지도록 넉넉히 읽어옴)
  const data = (raw || []).filter(s => isCheerable(s, link)).slice(0, 3);
  // 홈에서는 "최근 기록 묶음"처럼 compact하게: 식별 + 핵심 Re:Cheer + 날짜(초 없이)만.
  listEl.innerHTML = (data && data.length) ? data.map(s => {
    const label = sumLabel(s);
    const state = learnerItemState(s, link); // isCheerable로 이미 걸러진 목록이라 'none'은 나오지 않음
    const msgHtml = state.type === 'visible'
      ? `<div class="rc-m">${escapeHtml(state.msg.message)}</div>`
      : state.type === 'locked'
        ? `<div class="rc-m sub">🔒 이전 연결에서 받은 Re:Cheer</div>`
        : `<div class="rc-m sub">⏳ 응원 대기 중</div>`;
    const when = new Date(s.created_at).toLocaleString('ko-KR', { timeZone:'Asia/Seoul', month:'numeric', day:'numeric', hour:'numeric', minute:'2-digit' });
    return `<div class="rc-card"><div class="rc-t">${label}</div>${msgHtml}<div class="rc-d">${when}</div></div>`;
  }).join('') : `<div class="subtle">아직 보낸 Re:Step이 없어요.</div>`;
}
// ===== 월별 기록 모달 공통 헬퍼 =====
function addMonths(y, m, delta){
  const total = y * 12 + m + delta;
  return { y: Math.floor(total / 12), m: ((total % 12) + 12) % 12 };
}
function inMonth(dateStr, y, m){
  const d = new Date(dateStr);
  return d.getFullYear() === y && d.getMonth() === m;
}

// 학습자 월별 기록에서 각 Re:Step 항목의 표시 상태 판정.
// visible: 지금 연결된 상대가 보낸 응원이 있음 → 실제 메시지 표시
// pending: 응원은 아직 없지만 지금 관계 기준으로는 응원 대상임 → "응원 대기 중"
// locked : 응원은 있었지만 지금 연결과 다른(과거) 상대가 보낸 것 → 내용 숨김
// none   : 연결 전에 만들어져 지금 관계의 응원 대상이 아니고, 응원도 없음 → 표시 없음
function learnerItemState(s, link){
  const rawMsg = oneMsg(s.cheer_messages);
  const shown = getVisibleCheerMessage(s, link);
  if(shown) return { type: 'visible', msg: shown };
  if(rawMsg) return { type: 'locked' };
  if(isCheerable(s, link)) return { type: 'pending' };
  return { type: 'none' };
}

let learnerRecordCache = [];
let learnerRecordLink = null;
let learnerRecordViewYM = null;
async function openLearnerRecordModal(initialYM){
  const link = await getMyConnectedLink();
  const { data: raw, error } = await client
    .from('cheer_summaries')
    .select('*, cheer_messages(*)')
    .eq('learner_user_id', currentUserId)
    .order('created_at', { ascending: false });
  if(error){ toast('❌ ' + error.message); return; }
  learnerRecordCache = raw || []; // 내가 만든 기록 → 연결 여부와 무관하게 전부 보존
  learnerRecordLink = link;
  const now = new Date();
  learnerRecordViewYM = initialYM || { y: now.getFullYear(), m: now.getMonth() };
  $('modal').classList.add('show');
  renderLearnerRecordModal();
}
function renderLearnerRecordModal(){
  const { y, m } = learnerRecordViewYM;
  const data = learnerRecordCache;
  const link = learnerRecordLink;
  const monthItems = data.filter(s => inMonth(s.created_at, y, m));
  const stepCount = monthItems.length; // 내가 만든 것 → 무조건 전부 집계
  const cheerCount = data.filter(s => {
    const state = learnerItemState(s, link);
    return state.type === 'visible' && inMonth(state.msg.created_at, y, m);
  }).length; // 지금 보이는 응원만 집계 (연결 끊긴 과거 응원은 제외)

  const now = new Date();
  const earliest = data.length ? new Date(data[data.length - 1].created_at) : now;
  const canPrev = (y > earliest.getFullYear()) || (y === earliest.getFullYear() && m > earliest.getMonth());
  const canNext = (y < now.getFullYear()) || (y === now.getFullYear() && m < now.getMonth());

  const listHtml = monthItems.length ? monthItems.map(s=>{
    const label = sumLabel(s);
    const state = learnerItemState(s, link);
    let bodyHtml = '';
    if(state.type === 'visible') bodyHtml = `<p>"${escapeHtml(state.msg.message)}"</p>`;
    else if(state.type === 'pending') bodyHtml = `<p class="subtle" style="margin:5px 0 0">⏳ 응원 대기 중</p>`;
    else if(state.type === 'locked') bodyHtml = `<p class="subtle" style="margin:5px 0 0">🔒 이전 연결에서 받은 Re:Cheer</p>`;
    return `<div class="card record rose"><b>${label}</b>${bodyHtml}<div class="subtle">${new Date(s.created_at).toLocaleString('ko-KR')}</div></div>`;
  }).join('') : '<p class="subtle" style="text-align:center;margin:18px 0">이 달엔 기록이 없어요.</p>';

  $('sheet').innerHTML = `
    <div class="row" style="margin-bottom:10px">
      <button id="recordPrevBtn" class="smallbtn" ${canPrev?'':'disabled'}>◀</button>
      <h3 style="margin:0">${y}년 ${m+1}월 기록</h3>
      <button id="recordNextBtn" class="smallbtn" ${canNext?'':'disabled'}>▶</button>
    </div>
    <div class="stat-split">
      <div class="stat-chip green"><span class="stat-label">기록한 Re:Step</span><span class="stat-num">${stepCount}개</span></div>
      <div class="stat-chip lav"><span class="stat-label">받은 Re:Cheer</span><span class="stat-num">${cheerCount}개</span></div>
    </div>
    ${listHtml}
    <button id="closeHistory" class="btn secondary full" style="margin-top:14px">닫기</button>`;
  $('closeHistory').onclick = closeModal;
  if(canPrev) $('recordPrevBtn').onclick = () => { learnerRecordViewYM = addMonths(y, m, -1); renderLearnerRecordModal(); };
  if(canNext) $('recordNextBtn').onclick = () => { learnerRecordViewYM = addMonths(y, m, 1); renderLearnerRecordModal(); };
}

// ===== Re:Cheer 연결 (파트너 쪽 뷰) =====
// Re:Cheer 메인 = "받은편지함": 아직 Re:Cheer를 보내지 않은 Re:Step만. 보내고 나면 여기서 빠지고 달력 기록(Re:Cheer 기록)에서 본다.
// 캐릭터 영역은 상태와 무관하게 같은 높이로 고정(GIF가 바뀌어도 아래 내용이 안 움직임).
const CS_GIF_EMPTY = 'restep_empty.webp';     // 도착한 Re:Step 없음 — 편지를 기다리는 캐릭터
const CS_GIF_ARRIVED = 'restep_arrived.webp'; // 도착한 Re:Step 있음 — 편지가 와서 기뻐하는 캐릭터
async function loadCheerSection(){
  const uid = currentUserId;
  const { data: links, error } = await client.from('cheer_links').select('*').eq('partner_user_id', uid);
  if(error){ $('partnerBody').textContent = '❌ ' + error.message; return; }
  const connected = (links||[]).filter(l => l.status==='connected');

  if(!connected.length){
    // 연결 전 메인: 강아지 + 한 줄 안내 + 응원 파트너 되기 카드(제목·입력·버튼만). 요청 대기/취소 UI는 두지 않는다.
    $('partnerBody').innerHTML = `
      <div class="cs-stage wait"><img src="restep_waiting.webp" alt=""></div>
      <div class="cs-status soft">아직 연결된 학습자가 없어요.</div>
      <div class="cs-sub">초대코드를 입력해 연결 요청을 보내보세요.</div>
      <div class="cw-card">
        <div class="cw-head"><img class="cw-ico" src="icon_link_purple.png" alt=""><div class="cw-title">응원 파트너 되기</div></div>
        <input id="partnerCodeInput" class="cw-input" placeholder="상대방 초대코드 입력" autocomplete="off">
        <button class="cw-btn" id="sendPartnerRequest">연결 요청</button>
      </div>`;
    $('sendPartnerRequest').onclick = async () => {
      const code = $('partnerCodeInput').value.trim();
      if(!code){ toast('코드를 입력해주세요.'); return; }
      const { error } = await client.rpc('request_partner_connection', { p_code: code });
      if(error){ toast('❌ ' + error.message); return; }
      toast('연결 요청을 보냈어요.');
      $('partnerCodeInput').value = '';
      loadCheerSection();
    };
    return;
  }

  const learnerProfile = await fetchProfile(connected[0].learner_user_id);
  const name = escapeHtml(labelFor(learnerProfile));
  let { data: summaries, error: sErr } = await client.from('cheer_summaries')
    .select(`id, created_at, page_name_snapshot, study_day_number_snapshot, review_completed_count${SUMX}, cheer_messages(id), cheer_summary_items(id)`)
    .eq('learner_user_id', connected[0].learner_user_id).order('created_at', {ascending:false});
  if(sErr){
    console.warn('받은편지함 상세 조회 실패, 기본 조회로 대체:', sErr.message);
    ({ data: summaries } = await client.from('cheer_summaries').select('id, created_at, page_name_snapshot, study_day_number_snapshot, review_completed_count').eq('learner_user_id', connected[0].learner_user_id).order('created_at', {ascending:false}));
  }
  const pending = (summaries||[]).filter(sm => !oneMsg(sm.cheer_messages)); // 아직 답장 안 한 Re:Step만

  const cardRows = pending.map(sm => { // 최신순(조회 시 정렬), 5개까지 보여주고 나머지는 "더 보기"

    const label = sumLabel(sm);
    const newCount = Array.isArray(sm.cheer_summary_items) ? sm.cheer_summary_items.length : null;
    const meta = sm.kind === 'self'
      ? escapeHtml(sm.activity_name_snapshot || '') + (sm.amount_snapshot ? ' · ' + escapeHtml(sm.amount_snapshot) : '') // 자기주도: 활동명 · 시간/횟수(없으면 활동명만)
      : `복습 ${sm.review_completed_count}개` + (newCount !== null ? ` · 새로운 학습 ${newCount}개` : ''); // 실제 데이터만(자연어 요약 없음)
    // 카드 구조: [날짜칩][영역 아이콘][제목/서브문구] › — 같은 날짜여도 카드마다 날짜칩 반복
    return `<div class="cl-card chip" data-summary-id="${sm.id}">${sumChip(sm.created_at)}${sumIcon(sm)}<div class="cl-b"><div class="cl-t">${label}</div><div class="cl-m">${meta}</div></div><span class="cl-c">›</span></div>`;
  });
  const arrived = pending.length > 0;
  $('partnerBody').innerHTML = `
    <div class="cs-stage"><img src="${arrived ? CS_GIF_ARRIVED : CS_GIF_EMPTY}" alt=""></div>
    <div class="cs-status">${arrived ? '새로운 Re:Step이 도착했어요!' : '지금은 도착한 Re:Step이 없어요.'}</div>
    <div id="partnerSummaryList">${arrived ? sdFoldList(cardRows, 5) : `<div class="cs-slot"><div>${name}님의 Re:Step이 도착하면 여기에서 확인하고<br>Re:Cheer로 응원할 수 있어요.</div></div>`}</div>
    <div class="${arrived ? 'conn-meta' : 'cs-conn'}" style="text-align:center;${arrived ? 'margin-top:18px' : ''}">${name}님과 연결됨</div>`;
  document.querySelectorAll('#partnerSummaryList [data-summary-id]').forEach(el => { el.onclick = () => openSummary(el.dataset.summaryId); });
  document.querySelectorAll('#partnerSummaryList .rs-fold').forEach(f => {
    f.onclick = () => {
      const more = f.previousElementSibling.querySelector('.rs-more');
      const open = more.style.display === 'none';
      more.style.display = open ? 'block' : 'none';
      f.textContent = open ? '접기 ⌃' : `외 ${f.dataset.more}개 더 보기 ⌄`;
    };
  });
}
// 학습자 쪽 getMyConnectedLink()의 파트너 버전. cheer_summaries는 RLS SELECT 정책이
// "본인 학습자" / "연결된 파트너" 두 개가 OR로 합쳐지는 구조라(6번-4 버그 참고),
// 파트너 시점 조회 시 반드시 learner_user_id를 명시적으로 필터해야 자기 자신 요약과
// 안 섞임 → 그러려면 지금 연결된 학습자 id를 먼저 알아야 해서 이 헬퍼가 필요함.
async function getMyPartnerLink(){
  const { data: links } = await client.from('cheer_links').select('*').eq('partner_user_id', currentUserId).eq('status', 'connected');
  return (links && links.length) ? links[0] : null;
}

let partnerRecordCache = { messages: [], summaries: [] };
let partnerRecordViewYM = null;
let partnerRecordTab = 'cheer'; // 'cheer' = 보낸 Re:Cheer(기본), 'step' = 받은 Re:Step. 월만 바꿀 땐 유지.
// ===== Re:Cheer 기록 = "내가 보낸 답장의 달력" =====
// 달력에는 Re:Cheer를 보낸 날짜만 점으로 표시(Re:Step 도착일은 표시 안 함). 날짜를 고르면 그날 보낸 Re:Cheer 카드만 보이고,
// 카드를 누르면 Re:Step + 보낸 Re:Cheer가 함께 보이는 상세(archive mode)로 간다. 받은/보낸 탭 없음.
let cheerCal = { y: 0, m: 0, sel: null, messages: [] };
const kstKey = ts => new Date(ts).toLocaleDateString('en-CA', { timeZone: 'Asia/Seoul' }); // YYYY-MM-DD (KST)
const pad2 = n => String(n).padStart(2, '0');
function calLatestSelInMonth(y, m){
  const prefix = `${y}-${pad2(m+1)}-`;
  const days = cheerCal.messages.map(c=>kstKey(c.created_at)).filter(k=>k.startsWith(prefix)).sort();
  return days.length ? days[days.length-1] : null;
}
// 이번 달이면 오늘을 선택, 다른 달이면 그 달의 가장 최근 전송일(없으면 선택 없음)
function calDefaultSel(y, m){
  const t = kstKey(Date.now());
  if(y === +t.slice(0,4) && m === +t.slice(5,7) - 1) return t;
  return calLatestSelInMonth(y, m);
}
async function openPartnerRecordModal(initialYM){
  closeModal(); // 월간 리캡 모달 등에서 넘어올 때
  // "보낸 Re:Cheer"는 내가 만든 것이라 연결 여부와 무관하게 항상 볼 수 있다.
  const { data: messages, error } = await client
    .from('cheer_messages')
    .select(`*, cheer_summaries(page_name_snapshot, study_day_number_snapshot, created_at${SUMX})`)
    .eq('partner_user_id', currentUserId)
    .order('created_at', { ascending: false });
  if(error){ toast('❌ ' + error.message); return; }
  cheerCal.messages = messages || [];
  const todayKey = kstKey(Date.now());
  let y = +todayKey.slice(0,4), m = +todayKey.slice(5,7) - 1; // 항상 이번 달(리캡 등에서 월을 지정해 오면 그 달)
  if(initialYM){ y = initialYM.y; m = initialYM.m; }
  cheerCal.y = y; cheerCal.m = m;
  cheerCal.sel = calDefaultSel(y, m);
  renderCheerCalendar();
  screen('cheerRecordScreen');
  enterDetailNav(() => { screen('homeScreen'); setRole('partner'); loadCheerSection(); });
}
// 카드용 한 줄 요약: 공백/줄바꿈 정리 후 15자(이모지는 1자) 초과 시 말줄임
function cheerOneLine(text, max=15){
  const chars = Array.from(String(text||'').replace(/\s+/g,' ').trim());
  return chars.length > max ? chars.slice(0, max).join('').trimEnd() + '...' : chars.join('');
}
function renderCheerCalendar(){
  const { y, m, sel, messages } = cheerCal;
  const byDay = {};
  messages.forEach(c => { (byDay[kstKey(c.created_at)] = byDay[kstKey(c.created_at)] || []).push(c); });
  const todayKey = kstKey(Date.now());
  const nowY = +todayKey.slice(0,4), nowM = +todayKey.slice(5,7) - 1;
  const earliest = messages.length ? kstKey(messages[messages.length-1].created_at) : todayKey;
  const eY = +earliest.slice(0,4), eM = +earliest.slice(5,7) - 1;
  const canPrev = y > eY || (y === eY && m > eM);
  const canNext = y < nowY || (y === nowY && m < nowM);

  const firstDow = new Date(Date.UTC(y, m, 1)).getUTCDay();
  const dim = new Date(Date.UTC(y, m+1, 0)).getUTCDate();
  let cells = '';
  for(let i=0;i<firstDow;i++) cells += '<div class="cc-cell"></div>';
  for(let d=1; d<=dim; d++){
    const key = `${y}-${pad2(m+1)}-${pad2(d)}`;
    const has = !!byDay[key];
    cells += `<div class="cc-cell"><button class="cc-day${key===sel?' sel':''}${key===todayKey?' today':''}${has?' has':''}" data-day="${key}"><span>${d}</span>${has?'<i class="cc-dot"></i>':''}</button></div>`;
  }
  const dow = ['일','월','화','수','목','금','토'].map(x=>`<div class="cc-dow">${x}</div>`).join('');

  const dayMsgs = sel && byDay[sel] ? byDay[sel].slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)) : [];
  const listHtml = dayMsgs.length ? dayMsgs.map(c => {
    const s = c.cheer_summaries;
    const label = sumLabel(s);
    // 카드 = 빠른 훑어보기: 날짜칩(Re:Step 도착일) · 영역 아이콘 · 학습 영역+STUDY/STEP/복습 세션 · 내가 보낸 Re:Cheer 한 줄. 세부 내용·전체 문구는 상세에서.
    return `<div class="cl-card chip" data-open-summary="${c.summary_id}">${sumChip(s?.created_at || c.created_at)}${sumIcon(s)}<div class="cl-b"><div class="cl-t">${label}</div><div class="cl-m cl-one">${escapeHtml(cheerOneLine(c.message))}</div></div><span class="cl-c">›</span></div>`;
  }).join('') : `<p class="cs-hint" style="margin:18px 0">${sel ? '이날 보낸 Re:Cheer가 없어요.' : '이 달에 보낸 Re:Cheer가 없어요.'}</p>`;

  $('cheerRecordBody').innerHTML = `
    <div class="row" style="margin:6px 0 12px"><button id="calPrev" class="smallbtn" ${canPrev?'':'disabled'}>◀</button><h3 style="margin:0">${y}년 ${m+1}월</h3><button id="calNext" class="smallbtn" ${canNext?'':'disabled'}>▶</button></div>
    <div class="cc-grid">${dow}${cells}</div>
    <div style="margin-top:18px">${listHtml}</div>`;

  $('calPrev').onclick = () => { const r = addMonths(y, m, -1); cheerCal.y = r.y; cheerCal.m = r.m; cheerCal.sel = calDefaultSel(r.y, r.m); renderCheerCalendar(); };
  $('calNext').onclick = () => { const r = addMonths(y, m, 1); cheerCal.y = r.y; cheerCal.m = r.m; cheerCal.sel = calDefaultSel(r.y, r.m); renderCheerCalendar(); };
  document.querySelectorAll('#cheerRecordBody .cc-day').forEach(b => { b.onclick = () => { cheerCal.sel = b.dataset.day; renderCheerCalendar(); }; });
  document.querySelectorAll('#cheerRecordBody [data-open-summary]').forEach(el => {
    el.onclick = () => {
      const saved = { y: cheerCal.y, m: cheerCal.m, sel: cheerCal.sel, scrollY: window.scrollY };
      openSummary(el.dataset.openSummary, { archive: true, onBack: () => restoreCheerCalendar(saved) });
    };
  });
}
function restoreCheerCalendar(saved){
  setRole('partner');
  cheerCal.y = saved.y; cheerCal.m = saved.m; cheerCal.sel = saved.sel;
  renderCheerCalendar();
  screen('cheerRecordScreen');
  enterDetailNav(() => { screen('homeScreen'); setRole('partner'); loadCheerSection(); });

// ===== 월간 리포트 (월말 회고 경험) =====
// 기존 월별 기록 모달(위)은 "아카이브"로 그대로 유지. 이건 그거랑 별개로,
// "매달 한 번 짧게 돌아보는" 용도의 새 화면. 오늘 정한 연결 해제 정책(getVisibleCheerMessage)을
// 그대로 재사용해서 숫자를 구하되, 상세 목록/◀▶ 페이지네이션은 만들지 않음(그건 아카이브 몫).
async function getLearnerMonthlyStats(y, m){
  const link = await getMyConnectedLink();
  const { data: raw } = await client
    .from('cheer_summaries')
    .select('*, cheer_messages(*)')
    .eq('learner_user_id', currentUserId);
  const data = raw || [];
  const stepCount = data.filter(s => inMonth(s.created_at, y, m)).length; // 내가 만든 것 → 무조건 집계
  const cheerCount = data.filter(s => {
    const msg = getVisibleCheerMessage(s, link);
    return msg && inMonth(msg.created_at, y, m);
  }).length; // 지금 보이는 응원만
  return { stepCount, cheerCount };
}
async function getPartnerMonthlyStats(y, m){
  const link = await getMyPartnerLink();
  const { data: messages } = await client.from('cheer_messages').select('*').eq('partner_user_id', currentUserId);
  const sentCount = (messages || []).filter(c => inMonth(c.created_at, y, m)).length; // 내가 보낸 것 → 무조건 집계
  let receivedCount = 0;
  if(link){
    const { data: summaries } = await client.from('cheer_summaries').select('id, created_at').eq('learner_user_id', link.learner_user_id);
    receivedCount = (summaries || []).filter(s => inMonth(s.created_at, y, m)).length;
  } // 링크 없으면 0 — 상대가 만든 것이라 연결 끊기면 숨김
  return { receivedCount, sentCount };
}

// ===== 함께한 걸음 (공동 누적 지표) =====
// Re:Step + Re:Cheer가 완성된 1쌍 = +1. learnerId가 만들고 partnerId가 응원한 것만 카운트.
async function countCompletedSteps(learnerId, partnerId){
  const { data } = await client.from('cheer_summaries').select('id, cheer_messages(*)').eq('learner_user_id', learnerId);
  return (data || []).filter(s => {
    const msg = oneMsg(s.cheer_messages);
    return msg && msg.partner_user_id === partnerId;
  }).length;
}
// 현재 '연결된(status=connected)' 관계만 대상 — 연결 해제되면 그 상대와의 함께한 걸음은
// 화면에서 사라지고, 새 상대와 합산되지도 않는다(오늘 정한 정책과 동일한 원칙).
// 학습자 역할 상대와 파트너 역할 상대가 같은 사람이면(mutual) 두 방향을 합산해서 하나로 보여줌.
async function getMyRelationships(){
  const uid = currentUserId;
  const [{ data: asLearner }, { data: asPartner }] = await Promise.all([
    client.from('cheer_links').select('*').eq('learner_user_id', uid).eq('status', 'connected'),
    client.from('cheer_links').select('*').eq('partner_user_id', uid).eq('status', 'connected')
  ]);
  const learnerLink = (asLearner && asLearner[0]) || null; // 내가 학습자인 연결 (상대 = 나의 응원 파트너)
  const partnerLink = (asPartner && asPartner[0]) || null; // 내가 파트너인 연결 (상대 = 나의 학습자)
  const mutual = learnerLink && partnerLink && learnerLink.partner_user_id === partnerLink.learner_user_id;

  const results = [];
  if(mutual){
    const [mine, theirs] = await Promise.all([
      countCompletedSteps(uid, learnerLink.partner_user_id),
      countCompletedSteps(partnerLink.learner_user_id, uid)
    ]);
    const profile = await fetchProfile(learnerLink.partner_user_id);
    results.push({ name: labelFor(profile), mine, theirs, total: mine + theirs, mutual: true });
  } else {
    if(learnerLink){
      const [mine, profile] = await Promise.all([
        countCompletedSteps(uid, learnerLink.partner_user_id),
        fetchProfile(learnerLink.partner_user_id)
      ]);
      results.push({ name: labelFor(profile), mine, theirs: 0, total: mine, mutual: false, role: 'asLearner' });
    }
    if(partnerLink){
      const [theirs, profile] = await Promise.all([
        countCompletedSteps(partnerLink.learner_user_id, uid),
        fetchProfile(partnerLink.learner_user_id)
      ]);
      results.push({ name: labelFor(profile), mine: 0, theirs, total: theirs, mutual: false, role: 'asPartner' });
    }
  }
  return results;
}
function renderRelationshipBlock(r){
  const breakdown = r.mutual
    ? `<div class="subtle" style="margin-top:8px;font-size:11px;line-height:1.7">내 Re:Step + ${escapeHtml(r.name)}님의 Re:Cheer ${r.mine}<br>${escapeHtml(r.name)}님의 Re:Step + 내 Re:Cheer ${r.theirs}</div>`
    : (r.role === 'asLearner'
      ? `<div class="subtle" style="margin-top:8px;font-size:11px">내 Re:Step + ${escapeHtml(r.name)}님의 Re:Cheer</div>`
      : `<div class="subtle" style="margin-top:8px;font-size:11px">${escapeHtml(r.name)}님의 Re:Step + 내 Re:Cheer</div>`);
  return `<div style="text-align:center;margin-bottom:20px">
    <div style="font-weight:900;font-size:15px">🌱 ${escapeHtml(r.name)}님과 함께한 걸음 ${r.total}</div>
    ${breakdown}
  </div>`;
}

// 콘솔 전용 개발 진입점. 사용자 UI엔 버튼/메뉴를 추가하지 않음 — 테스트가 끝나도 화면엔 그대로
// 노출되지 않음. month는 1~12(사람이 읽는 월) 그대로 받고 내부에서만 0-index로 변환.
// 예: openMonthlyRecap(2026, 9) → 2026년 9월 (내부에서만 m=8로 계산됨)
async function openMonthlyRecap(year, month){
  if(month < 1 || month > 12){
    console.warn('openMonthlyRecap: month는 1~12 사이(사람이 읽는 월)여야 해요. 예: openMonthlyRecap(2026, 9) → 2026년 9월');
    return;
  }
  const y = year, m = month - 1;
  const [learnerStats, partnerStats, relationships] = await Promise.all([
    getLearnerMonthlyStats(y, m),
    getPartnerMonthlyStats(y, m),
    getMyRelationships()
  ]);
  renderMonthlyRecap(y, m, learnerStats, partnerStats, relationships);
}
// 실제 월말 알림을 눌렀을 때의 흐름 검증용 — "지금" 날짜 기준 지난달을 자동 계산해서 엶.
// (연도 경계도 자동 처리됨: 1월에 호출하면 작년 12월로 넘어감 — addMonths가 이미 처리)
async function openPreviousMonthRecap(){
  const now = new Date();
  const prev = addMonths(now.getFullYear(), now.getMonth(), -1);
  const [learnerStats, partnerStats, relationships] = await Promise.all([
    getLearnerMonthlyStats(prev.y, prev.m),
    getPartnerMonthlyStats(prev.y, prev.m),
    getMyRelationships()
  ]);
  renderMonthlyRecap(prev.y, prev.m, learnerStats, partnerStats, relationships);
}
// classic <script>라 사실 전역 함수는 이미 window에 붙지만, 의도를 명확히 하려고 명시적으로도 노출.

// 파트너가 이 Re:Step을 한 번이라도 열어본 적 있는지 추적(새 Re:Step 배지용).
// "새로 도착했는가"와 "아직 응원 안 했는가"는 다른 상태라서 따로 관리함 — 계정이 아니라
// 이 브라우저 기준(localStorage), lastSeenCheer와 같은 방식.
function openedSummariesKey(){ return 'restep-opened-summaries-' + currentUserId; }
function isSummaryOpened(id){
  try{ return JSON.parse(localStorage.getItem(openedSummariesKey()) || '[]').includes(id); }
  catch(e){ return false; }
}
function markSummaryOpened(id){

    const list = JSON.parse(localStorage.getItem(openedSummariesKey()) || '[]');

  } catch(e){ /* 실패해도 기능엔 지장 없음 — 그냥 계속 새 걸로 보일 뿐 */ }

// ===== 공통 상세 UI shell =====
// 학습자 "기록 상세"(tone='sage')와 파트너 "Re:Step 상세"(tone='lav')는 같은 부품을 쓰고, tone과 안에 넣는
// 정보의 깊이만 다르다: 요약 카드 → 복습|새 학습 인덱스 → 가로 swipe 카드 → dots → (호출부가 붙이는) Re:Cheer/액션.
// 한쪽 디자인을 고치면 다른 쪽도 같이 바뀌도록 이 부품들만 수정할 것.
const SD_COLLAPSE_AT = 3;
function sdRow(n, bodyHtml, attrs){ return `<div class="rs-row"${attrs?' '+attrs:''}><span class="rs-n">${n}</span><div class="rs-b">${bodyHtml}</div></div>`; }
function sdFoldList(rows, limit){ // 기본 3개까지 노출, 넘으면 "외 N개 더 보기"로 같은 자리에서 펼침
  const lim = limit || SD_COLLAPSE_AT;
  const shown = rows.slice(0, lim).join('');
  const hidden = rows.slice(lim).join('');
  if(!hidden) return `<div class="rs-list">${shown}</div>`;
  const n = rows.length - lim;
  return `<div class="rs-list">${shown}<div class="rs-more" style="display:none">${hidden}</div></div><div class="rs-fold" data-more="${n}">외 ${n}개 더 보기 ⌄</div>`;
}
function sdPage(headTitle, rows, emptyText){
  return rows.length ? `<div class="rs-h">${headTitle}</div>${sdFoldList(rows)}` : `<p class="subtle" style="margin:4px 0">${emptyText}</p>`;
}

function sdWhen(ts){ return new Date(ts).toLocaleString('ko-KR', { timeZone:'Asia/Seoul', year:'numeric', month:'numeric', day:'numeric', hour:'numeric', minute:'2-digit' }); }
function sdDetailHtml({ tone, title, dateLabel, reviewCount, newCount, reviewPage, newPage }){

    <div class="rs-dots"><span class="on"></span><span></span></div>

const sdCleanups = {};
// 인덱스 탭 / swipe / dots는 같은 "현재 페이지" 상태를 공유. swipe는 CSS scroll-snap(모바일), 마우스는 드래그,
// 높이는 현재 페이지 내용에 맞춤. 반환값: { goTo }
function wireSdShell(root, key, onChange){
  if(sdCleanups[key]) sdCleanups[key]();
  const vp = root.querySelector('.rs-viewport');
  const pages = [...vp.children];
  const tabs = [...root.querySelectorAll('.rs-tabs button, .sa-tabs button')];
  const dots = [...root.querySelectorAll('.rs-dots span')];
  let active = 0, lock = false, lockTimer = null, drag = null;
  const syncHeight = () => { vp.style.height = pages[active].offsetHeight + 'px'; };
  const setActive = i => {
    active = i;
    tabs.forEach((t,k)=>t.classList.toggle('active', k===i));
    dots.forEach((d,k)=>d.classList.toggle('on', k===i));
    syncHeight();
    if(onChange) onChange(i);
  };
  const jump = i => { // 애니메이션 없이 바로 이동(다시 그린 뒤 보던 탭 복원용)
    setActive(i);
    vp.style.scrollSnapType = 'none'; vp.scrollLeft = i * vp.clientWidth;
    requestAnimationFrame(() => { vp.style.scrollSnapType = ''; });
  };
  const goTo = i => {
    setActive(i);
    lock = true; clearTimeout(lockTimer);
    vp.scrollTo({ left: i*vp.clientWidth, behavior: 'smooth' });
    lockTimer = setTimeout(()=>{ lock = false; }, 450);
  };
  tabs.forEach((t,k)=>{ t.onclick = () => goTo(k); });
  vp.addEventListener('scroll', () => {
    if(lock) return;
    const i = Math.round(vp.scrollLeft / vp.clientWidth);
    if(i !== active && i >= 0 && i < pages.length) setActive(i);
  });
  let ro = null;
  let lastW = 0;
  const onResize = () => { // 높이는 현재 페이지에 맞추고, 화면 폭이 바뀌었거나 숨겨졌다 나타났다면 현재 탭 위치를 다시 맞춤
    syncHeight();
    if(vp.clientWidth && vp.clientWidth !== lastW){ lastW = vp.clientWidth; if(!lock && !drag) vp.scrollLeft = active * vp.clientWidth; }
  };
  if(window.ResizeObserver){ ro = new ResizeObserver(onResize); pages.forEach(pg=>ro.observe(pg)); ro.observe(vp); }
  requestAnimationFrame(syncHeight);
  vp.addEventListener('pointerdown', e => {
    if(e.pointerType !== 'mouse' || e.button !== 0 || vp.classList.contains('noswipe')) return;
    drag = { x: e.clientX, left: vp.scrollLeft };
    vp.style.scrollSnapType = 'none'; vp.classList.add('dragging');
  });
  const onMove = e => { if(drag) vp.scrollLeft = drag.left - (e.clientX - drag.x); };
  const endDrag = e => {
    if(!drag) return;
    const dx = e.clientX - drag.x; drag = null;
    vp.style.scrollSnapType = ''; vp.classList.remove('dragging');
    goTo(Math.max(0, Math.min(pages.length-1, active + (dx < -40 ? 1 : dx > 40 ? -1 : 0))));
  };
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);
  sdCleanups[key] = () => { window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', endDrag); window.removeEventListener('pointercancel', endDrag); if(ro) ro.disconnect(); };
  root.querySelectorAll('.rs-fold').forEach(f => {
    f.onclick = () => {
      const more = f.previousElementSibling.querySelector('.rs-more');
      const open = more.style.display === 'none';
      more.style.display = open ? 'block' : 'none';
      f.textContent = open ? '접기 ⌃' : `외 ${f.dataset.more}개 더 보기 ⌄`;
    };
  });
  return { goTo, jump };
}

// opts.archive: 월간 "보낸 Re:Cheer" 기록에서 다시 연 과거 Re:Step(읽기 전용, Re:Cheer 작성 UI 없음).
// opts.onBack: "←"를 눌렀을 때 돌아갈 곳(호출부가 넘김). 내용은 항상 발송 당시 snapshot
// (cheer_summaries / cheer_summary_items / cheer_summary_reviews)에서만 읽으므로, 이후 원본
// STUDY가 수정·삭제·재정렬돼도 안 바뀐다. 개인 메모와 REVIEW STEP은 원래 snapshot에 없음.
let summaryBackHandler = null;
async function openSummary(summaryId, opts){
  const archive = !!(opts && opts.archive);
  const learnerView = !!(opts && opts.learnerView); // 학습자가 자기 Re:Step snapshot을 읽기 전용으로 열 때(복습-only 세션 등)
  const readOnly = archive || learnerView;
  summaryBackHandler = (opts && opts.onBack) || null;
  activeSummaryId = summaryId;
  const { data: s, error } = await client.from('cheer_summaries').select('*, cheer_messages(*)').eq('id', summaryId).single();
  if(error || !s){
    toast('이 Re:Step은 현재 연결 관계에서 확인할 수 없어요.');
    if(summaryBackHandler) summaryBackHandler(); else screen('homeScreen');
    return false;
  }
  markSummaryOpened(summaryId);
  const { data: items } = await client.from('cheer_summary_items').select('*').eq('summary_id', summaryId).order('position');
  const { data: reviews } = await client.from('cheer_summary_reviews').select('*').eq('summary_id', summaryId).order('study_day_number').order('stage_index');
  const title = sumLabel(s);
  let existingMsg = oneMsg(s.cheer_messages);
  let learnerState = null;
  if(learnerView){ // 학습자는 기존 관계 가시성 정책(learnerItemState)대로만 받은 응원을 봄
    learnerState = learnerItemState(s, await getMyConnectedLink());
    existingMsg = learnerState.type === 'visible' ? learnerState.msg : null;
  }
  const quickList = (existingMsg || readOnly) ? [] : await getQuickCheers();
  const normPage = v => (!v || v === 'EMPTY') ? '' : v;
  // 파트너에겐 "무엇을 복습했는지"만 보임 — 1차복습 같은 REVIEW STEP, 밀림, 메모는 노출 안 함(공통 shell에 넣는 정보가 얕을 뿐).
  // cheer_summary_reviews엔 STUDY 번호만 저장돼 있어서(내용 스냅샷 없음) 지금은 STUDY 번호만 표시.
  const reviewedDays = [...new Set((reviews||[]).map(r=>r.study_day_number))].sort((x,y)=>y-x);
  const reviewRows = reviewedDays.map((n,i) => sdRow(i+1, `<div class="rs-t">STUDY ${n}</div>`));
  const itemRows = (items||[]).map((it,i) => {
    const range = formatPageRange(normPage(it.page_from_snapshot), normPage(it.page_to_snapshot));
    return sdRow(i+1, `<div class="rs-t">${escapeHtml(it.title_snapshot)}</div>${range?`<div class="rs-s">${escapeHtml(range)}</div>`:''}`);
  });
  const reviewEmpty = s.review_completed_count>0 ? '이전 Re:Step이라 복습한 내용이 자세히 남아있지 않아요.' : '이번 Re:Step에는 복습한 STUDY가 없어요.';
  const detailHtml = (s.kind === 'self') ? sdSelfDetailHtml(s, title) : sdDetailHtml({
    tone: 'lav', title, dateLabel: formatKSTDate(s.created_at), // 파트너는 학습 기간을 읽을 수 없어 Re:Step이 만들어진 날짜를 표시
    reviewCount: s.review_completed_count, newCount: itemRows.length,
    reviewPage: sdPage(`복습한 STUDY ${reviewRows.length}개`, reviewRows, reviewEmpty),
    newPage: sdPage(`새로운 학습 ${itemRows.length}개`, itemRows, '이번 Re:Step에는 새로운 학습이 없어요.')
  });
  $('summaryDetail').innerHTML = detailHtml + `
    ${learnerView
      ? (existingMsg
          ? sdCheerNote('받은 Re:Cheer', existingMsg.message, sdWhen(existingMsg.created_at))
          : `<div class="section-head" style="margin-top:26px;margin-bottom:8px"><h3 style="margin:0;font-size:14px">받은 Re:Cheer</h3></div><p class="subtle" style="margin:0 2px">${learnerState.type==='locked' ? '이전 연결에서 받은 Re:Cheer예요.' : '아직 받은 응원이 없어요.'}</p>`)
      : existingMsg
      ? sdCheerNote('보낸 Re:Cheer', existingMsg.message, sdWhen(existingMsg.created_at))
      : archive
      ? `<p class="subtle" style="margin:18px 2px 4px">보낸 Re:Cheer가 없어요.</p>`
      : `<div class="section-head" style="margin-top:0"><h3>빠른 응원 문구</h3></div>
         <div class="quick" id="quickCheerGrid">${quickList.map((q,i)=>`<button data-quick-index="${i}">${escapeHtml(q.text)}</button>`).join('')}<button id="addQuickBtn">＋ 문구 추가</button></div>
         <div class="section-head"><h3>직접 쓰기</h3></div>
         <textarea id="cheerMsg" rows="3" placeholder="응원 메시지를 직접 적어보세요."></textarea>
         <button class="btn purple full" id="sendCheerBtn" style="margin-top:12px">Re:Cheer 보내기 💌</button>`}`;
  if(s.kind !== 'self') wireSdShell($('summaryDetail').querySelector('.sd'), 'summary');

  if(!existingMsg && !readOnly){
    document.querySelectorAll('[data-quick-index]').forEach(b=>b.onclick=()=>{
      document.querySelectorAll('[data-quick-index]').forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected');
      $('cheerMsg').value = '';
      $('cheerMsg').dataset.selected = quickList[+b.dataset.quickIndex].text;
    });
    $('cheerMsg').oninput = () => { document.querySelectorAll('[data-quick-index]').forEach(x=>x.classList.remove('selected')); $('cheerMsg').dataset.selected=''; };
    $('addQuickBtn').onclick = () => {
      showModal(`<h3>빠른 응원 문구 추가</h3><input id="newQuickText" placeholder="응원 문구"><button id="saveQuickText" class="btn purple full" style="margin-top:10px">추가</button>`);
      $('saveQuickText').onclick = async () => {
        const v = $('newQuickText').value.trim();
        if(v){ await client.from('quick_cheers').insert({ user_id: currentUserId, text: v, position: quickList.length }); }
        closeModal();
        openSummary(summaryId, { onBack: summaryBackHandler }); // 다시 그려도 돌아갈 곳(원래 하던 화면)을 잃지 않게
      };
    };
  }

  if($('sendCheerBtn')) $('sendCheerBtn').onclick = async () => {
    const msg = $('cheerMsg').value.trim() || $('cheerMsg').dataset.selected || '';
    if(!msg){ toast('응원 문구를 선택하거나 작성해주세요.'); return; }
    const { error } = await client.from('cheer_messages').insert({ summary_id: summaryId, partner_user_id: currentUserId, message: msg });
    if(error){ toast('❌ ' + error.message); return; }
    toast('Re:Cheer가 전달됐어요 💌');
    // 뒤로가기(←)와 같은 경로로 돌아간다: 앱 밖 푸시로 들어왔다면 원래 하던 화면, 파트너 홈에서 열었다면 파트너 홈.
    goBackFromDetail(() => { screen('homeScreen'); loadCheerSection(); });
    loadCheerSection(); // 숨은 상태여도 파트너 홈 목록은 최신으로
  };
  screen('summaryScreen');
  enterDetailNav(() => { if(summaryBackHandler) summaryBackHandler(); else { screen('homeScreen'); loadCheerSection(); } });
  return true; // 상세가 정상적으로 열림(알림 읽음 처리 판단용)
}
$('summaryBackBtn').onclick = () => goBackFromDetail(() => { screen('homeScreen'); loadCheerSection(); });

// ===== 알림 벨 =====
// ── 앱 안 알림 읽음 상태(알림 단위, 이 브라우저 기준 localStorage) ──
// 목록을 열거나 화면에 보이기만 해서는 읽음 처리 안 함. 알림을 눌러 상세가 실제로 열린 뒤에만 그 알림 하나만 읽음.
// id: 'cheer:<summary_id>'(학습자가 받은 Re:Cheer), 'step:<summary_id>'(파트너가 받은 Re:Step). 앱 밖 푸시를 눌러 들어가도
// 같은 라우터를 거치므로 대응되는 앱 안 알림이 함께 읽음 처리된다.
function notifReadKey(){ return 'restep-notif-read-' + currentUserId; }
function getNotifRead(){ try{ return new Set(JSON.parse(localStorage.getItem(notifReadKey()) || '[]')); }catch(e){ return new Set(); } }
function markNotifRead(id){
  try{
    const set = getNotifRead(); set.add(id);
    localStorage.setItem(notifReadKey(), JSON.stringify([...set].slice(-300)));
  }catch(e){}
  updateNotifBadge();
}
function lastSeenKey(){ return 'restep-last-seen-cheer-' + currentUserId; }
function getLastSeenCheer(){ return localStorage.getItem(lastSeenKey()) || '1970-01-01T00:00:00Z'; }
function setLastSeenCheerNow(){ localStorage.setItem(lastSeenKey(), new Date().toISOString()); }

let notifBadgeToken = 0;
function hideNotifBadge(){ for(const id of ['notifBadge','areaNotifBadge']){ const b = $(id); b.textContent = ''; b.style.display = 'none'; } }
async function updateNotifBadge(){
  const uid = currentUserId;
  if(!uid) return;
  const role = currentRole;
  const token = ++notifBadgeToken; // 역할을 바꾸는 사이 늦게 끝난 이전 계산 결과가 배지를 덮어쓰지 않게
  // 알림(🔔)은 학습자 화면에만 있다. 응원 파트너 화면에는 🔔이 없으니 계산하지 않고 배지를 비운다
  // (예전엔 파트너로 볼 때도 숨겨진 🔔 배지에 새 Re:Step 수를 써둬서, 학습자로 돌아올 때 그 숫자가 잠깐 보였다 사라졌음).
  if(role !== 'learner'){ hideNotifBadge(); return; }
  let count = 0;
  const { data: learnerLinks } = await client.from('cheer_links').select('*').eq('learner_user_id', uid).eq('status','requested');
  count += (learnerLinks||[]).length;

  // 학습자로서 "새로 받은 Re:Cheer" — 지금 연결된 파트너가 보낸 것만 카운트.
  // (필터 없이 세면, 연결 끊긴 과거 파트너가 예전에 보낸 메시지가 배지에 뒤늦게 잡힐 수 있음)
  const myLearnerLink = await getMyConnectedLink();
  if(myLearnerLink){
    const lastSeen = getLastSeenCheer();
    const { data: newCheers } = await client
      .from('cheer_messages')
      .select('*, cheer_summaries!inner(learner_user_id)')
      .eq('cheer_summaries.learner_user_id', uid)
      .eq('partner_user_id', myLearnerLink.partner_user_id)
      .gt('created_at', lastSeen);
    const readC = getNotifRead();
    count += (newCheers||[]).filter(c=>!readC.has('cheer:'+c.summary_id)).length;
  }

  if(token !== notifBadgeToken || currentRole !== role) return; // 그 사이 역할이 바뀌었으면 이 결과는 버림
  const badge = $('notifBadge');
  badge.textContent = count>9 ? '9+' : String(count);
  badge.style.display = count>0 ? 'flex' : 'none';
  const ab = $('areaNotifBadge'); ab.textContent = badge.textContent; ab.style.display = badge.style.display; // 목차 화면 header 알림 배지도 같은 값
}
// 알림 안에서 바로 수락/거절하는 연결 요청 카드. 이미 다른 파트너와 연결돼 있으면
// 바로 수락할 수 없으니 그 경우만 "연결 관계 관리"로 보냄(기존 화면 재사용, 새 화면 안 만듦).
async function renderNotifIncomingCard(link, alreadyConnected){
